tive":"","notes":"","source":"","body":"a police officer in a khaki uniform with a name badge, upright posture, measured expression"},{"id":"subject/tea-stall-owner","title":"Tea Stall Owner","category":"subject","medium":["image","video"],"models":["any"],"tags":["person","elderly","indian","rural","tea"],"negative":"","notes":"","source":"","body":"an elderly tea-stall owner with a white beard and white skullcap, pouring tea from a dented steel kettle"},{"id":"subject/village-child","title":"Village Child","category":"subject","medium":["image","video"],"models":["any"],"tags":["person","child","rural","indian"],"negative":"","notes":"","source":"","body":"a seven-year-old village boy in a checked cotton shirt, short dark hair, wide curious eyes"},{"id":"subject/whiskey-tumbler","title":"Whiskey Tumbler","category":"subject","medium":["image","video"],"models":["any"],"tags":["product","drink","luxury","object"],"negative":"","notes":"","source":"","body":"a crystal whiskey tumbler with two clear ice cubes on a polished walnut desk"},{"id":"subject/white-suv-police","title":"White SUV Police","category":"subject","medium":["image","video"],"models":["any"],"tags":["vehicle","indian","rural","police"],"negative":"","notes":"","source":"","body":"a white SUV with a red beacon light on the roof, dusty from the road"},{"id":"subject/young-woman-portrait","title":"Young Woman Portrait","category":"subject","medium":["image","video"],"models":["any"],"tags":["person","woman","portrait"],"negative":"","notes":"","source":"","body":"a young woman in her mid-twenties with natural skin texture, dark hair tied back, calm direct gaze"},{"id":"template/character-sheet-appearance-variant","title":"Character Sheet Appearance Variant","category":"template","medium":["image"],"models":["any"],"tags":["character-sheet","appearance-variant","consistency","aging","continuity"],"negative":"","notes":"Attach the approved identity sheet (or the preceding variant in the chain). Generate earlier variants before later ones.","source":"vachan production prompts (generalized)","body":"Create a cinematic character reference sheet for {{subject}} — [STATE: pregnant / injured / aged / imprisoned].\n\nUse the attached approved reference to preserve the character's exact facial identity and established design while applying only the appearance changes described below.\n\nLayout: [same four-view layout as the base sheet].\n\nPreserve: [face, skin tone, eyes, nose, age, hairstyle, costume design — list explicitly].\nChange only: [the state — body, expression, wear and fading, aging in years, gray strands, repairs].\nKeep unchanged: [jewelry, restraints, garment arrangement, which shoulder the drape sits on].\n\n[Look line identical to the base sheet.]"},{"id":"template/character-sheet-image","title":"Character Sheet (Image)","category":"template","medium":["image"],"models":["seedance-2","higgsfield"],"tags":["character-sheet","consistency","casting","turnaround"],"negative":"","notes":"Character sheet = WHO is this person. The shot prompt = WHAT is this person doing in this scene. Lock face, hair, skin tone, body proportions, costume base.","source":"creator-handover-guide","body":"Character reference sheet of {{subject}}, plain neutral background, even soft studio lighting. Layout: front view, three-quarter view and profile view of the same person, plus a close-up of the face. Consistent face, hair and facial details, natural skin texture, clear body proportions, basic costume foundation shown in full. Same person in every view."},{"id":"template/cinematic-portrait","title":"Cinematic Portrait","category":"template","medium":["image"],"models":["any"],"tags":["portrait","cinematic","person"],"negative":"","notes":"","source":"","body":"Portrait of {{subject}}, 85mm lens at f/1.8, soft window light from the side, natural skin texture, shallow depth of field, calm direct gaze, subtle film grain."},{"id":"template/dialogue-line-block-with-pronunciation","title":"Dialogue Line Block with Pronunciation","category":"template","medium":["video"],"models":["seedance-2"],"tags":["dialogue","hindi","pronunciation","acting","speech","multilingual"],"negative":"","notes":"Pair with method/dialogue-and-pronunciation-rules. Only the quoted line is audible; guide, meaning and acting are silent directions.","source":"vachan production prompts (generalized)","body":"SPEAKER: \"[Line in Roman script, natural spelling]\"\nPronunciation guide: [syllable-split, CAPITALS on stressed or long syllables]\nEnglish meaning (silent): [translation — never spoken]\nActing (silent): [how the thought changes: start state → turn on a named word → end state; eyeline; vocal register; what the listener does]"},{"id":"template/door-and-gate-swing-block","title":"Door and Gate Swing Block","category":"template","medium":["video"],"models":["seedance-2"],"tags":["door","gate","hinge","geometry","continuity","blocking"],"negative":"","notes":"Doors are a classic continuity failure. State hinge side, swing direction, arc and which leaf moves from both sides of the door.","source":"vachan production prompts (generalized)","body":"Viewed from INSIDE facing the doorway, the active [RIGHT] leaf is hinged at the outer [RIGHT] jamb and swings [inward] to the [right] return wall; the other leaf stays closed. From the corridor the same physical leaf appears on the opposite side. Show the fixed hinge, threshold and arc. [Characters] remain clear of the swing. [Name] enters and holds the gate-side flank; [name] occupies the corridor side of the exit. The opening is between the stationary leaf and the opened leaf. Close it along the same arc until it meets the stationary leaf, then [slide the exterior bolt]."},{"id":"template/establishing-shot","title":"Establishing Shot","category":"template","medium":["image","video"],"models":["any"],"tags":["establishing","wide","location"],"negative":"","notes":"","source":"","body":"Wide establishing shot of {{subject}}, full environment visible with scale, time of day and weather clearly readable, layered depth, atmospheric haze."},{"id":"template/four-view-character-sheet","title":"Four-View Character Sheet","category":"template","medium":["image"],"models":["any"],"tags":["character-sheet","four-view","casting","consistency","identity","new-character"],"negative":"","notes":"Standalone sheet for a new character. State what makes this face distinct from other principals so the model does not converge them.","source":"vachan production prompts (generalized)","body":"Create a cinematic character reference sheet for {{subject}}.\n\nLayout: four clearly separated photographic views on one landscape image — full-body front, full-body rear, waist-up three-quarter view, and a detailed face close-up. Exactly the same person, facial features, age, body proportions, clothing, jewelry and hairstyle in every panel. Plain neutral background, clear readable illumination. The canvas contains photographic views only.\n\n[Person: apparent age range, skin tone, face shape, eyes, nose, brows, build, posture, expression.]\n\n[Costume: garments with colors, borders, fabrics; which shoulder things sit on; hair arrangement; jewelry; footwear; what the hands hold or that they are empty. Fix any asymmetric detail with LEFT/RIGHT.]\n\n[Look: photorealistic, natural skin, tactile cloth, soft directional studio illumination that reveals identity and fabric construction. Full-body views include complete head and feet. Original individual face and believable human proportions.]"},{"id":"template/infant-reference-sheet","title":"Infant Reference Sheet","category":"template","medium":["image"],"models":["any"],"tags":["character-sheet","infant","newborn","baby","safe-pose","consistency"],"negative":"","notes":"Never stand or hold an infant upright in reference sheets. Distinguish multiple infants by both face and wrap design.","source":"vachan production prompts (generalized)","body":"Create a cinematic character reference sheet for {{subject}}, a newborn.\n\nLayout: four clearly separated photographic views on one landscape image — supported full-length front view, supported full-length side view, supported three-quarter upper-body view, and detailed face close-up. Exactly the same infant, age, facial features, hair and wrapping cloth in every panel. Every pose is safely reclining with full head and neck support on a plain padded surface. Plain neutral background and clear gentle illumination. The canvas contains photographic views only.\n\n[Infant: skin tone, face shape, hair, eyes closed or softly open, cheeks, hands, build relative to other infants in the story.]\n\n[Wrap: one cloth, its color, border, stitching and weave — a distinctive design that separates this infant from every other infant in the film. Face uncovered, head and neck supported.]\n\n[Look: natural infant skin texture, soft directional illumination, tactile cotton, believable newborn proportions.]"},{"id":"template/mcsla-video-prompt","title":"MCSLA Video Prompt","category":"template","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["mcsla","higgsfield","structure"],"negative":"","notes":"Five layers: Model · Camera · Subject · Look · Action. Keep under ~200 words.","source":"higgsfield skill","body":"Model: [model name]. Aspect ratio [16:9], duration [8s].\nCamera: [one named camera move or shot size + angle].\nSubject: {{subject}}\nLook: [style, lighting, color grade].\nAction: [one clear physical action, then the end state]."},{"id":"template/physical-action-template","title":"Physical Action Template","category":"template","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["physics","action","comedy","object"],"negative":"","notes":"Answer: what causes the movement, which direction, what it touches, where it ends, does the character react, what should NOT happen.","source":"creator-handover-guide","body":"{{subject}} is affected by [CAUSE]. It slowly moves [DIRECTION]. It touches [CONTACT POINT], then moves to [FINAL POSITION]. The movement follows natural gravity and realistic physics. The object must not [COMMON WRONG MOVEMENTS]. The character reacts [REACTION]."},{"id":"template/product-hero-shot","title":"Product Hero Shot","category":"template","medium":["image","video"],"models":["any"],"tags":["product","hero","studio","advertising"],"negative":"","notes":"","source":"","body":"{{subject}} on a seamless reflective surface, centered, clean studio softbox lighting with a subtle rim light, crisp specular highlights, shallow depth of field, premium minimal advertising look."},{"id":"template/scene-starter","title":"Scene Starter","category":"template","medium":["image","video"],"models":["any"],"tags":["starter","basic","scene"],"negative":"","notes":"Smallest useful skeleton: who, where, when, doing what. Add camera, light and style fragments from the composer.","source":"","body":"{{subject}}, in [location], [time of day], [one clear action]."},{"id":"template/seedance-15s-three-shot-block","title":"Seedance 15s Three-Shot Block","category":"template","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["seedance","15-seconds","multi-shot","sequence"],"negative":"","notes":"A block needs a clear beginning, one main action and a clear end state. Too many unrelated actions → split into more blocks.","source":"creator-handover-guide","body":"15-second continuous sequence with three connected shots.\n\nSHOT 1 — 0-5 seconds\n[Beat 1: establishing or detail. Subject: {{subject}}. Camera start, move and framing.]\n\nSHOT 2 — 5-10 seconds\n[Beat 2: main action. What stays sharp, what is out of focus, how the camera moves.]\n\nSHOT 3 — 10-15 seconds\n[Beat 3: reaction or information. Dialogue if any. Clear end state that can connect to the next block.]\n\nKeep the same character, location, lighting and props throughout. [Realism notes.] [Restrictions.]"},{"id":"template/seedance-practical-prompt-order","title":"Seedance Practical Prompt Order","category":"template","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["seedance","structure","order","checklist"],"negative":"","notes":"Not a fixed formula — the order to think through when you need control. Write what matters, skip the rest.","source":"creator-handover-guide","body":"[Duration / shot type].\n[Location and time of day].\n[Character + character reference]: {{subject}}\n[Appearance / costume if relevant].\n[Action — exactly what the character does].\n[Camera movement and framing — where it starts, what it sees, how it moves].\n[Important timing or physical action — what happens at which second].\n[Lighting that fits the scene].\n[Audio / dialogue if needed — what is said and when].\n[Performance — how the character behaves].\n[Visual style / realism].\n[What must not happen: no cuts, no extra characters, no identity change]."},{"id":"template/single-character-position-prompt","title":"Single-Character Position Prompt","category":"template","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["single-character","position","anchor","blocking"],"negative":"","notes":"For one character where position, pose and contact points matter. For two or more characters, anchor cross-character geometry separately.","source":"higgsfield-seedance templates","body":"[At/from N seconds] One character in frame.\n\n[Identity, Soul ID handle].\n  Screen position: [left third / center / right third], x-position [%], y-position [%], frame occupancy [%].\n  Depth layer: [foreground / midground / background].\n  Body orientation: [toward camera / away / profile-left / profile-right / three-quarter].\n  Pose: [physical configuration].\n  Gaze: [where they look — frame-position or off-screen direction].\n  Contact points: [physical surfaces — feet planted, hand on doorframe].\n  State lock: [emotional or physical state].\n\nOne dominant action: [single action — one motion verb at the spine of the shot].\nMotion: [secondary motion — hair, fabric, breath; eye motion].\n\nCamera: [shot size], [angle], [lens], [movement — one dominant motion].\nSetting: [location, time, weather, atmosphere].\nAesthetic: [genre, lighting, color grade, texture].\nAudio: [ambience, SFX, dialogue, music].\nFinal frame: [composition at last frame]."},{"id":"template/timed-multi-shot-clip-prompt","title":"Timed Multi-Shot Clip Prompt","category":"template","medium":["video"],"models":["seedance-2"],"tags":["seedance","multi-shot","timed-shots","production","clip","structure"],"negative":"","notes":"Production-grade 30s clip skeleton: every block exists to prevent a specific drift (identity, geography, ownership, continuity).","source":"vachan production prompts (generalized)","body":"[CLIP ID]: [clip title]\nDuration: [30] seconds\n\n[GLOBAL LOOK — one paragraph: genre, photographic realism, texture words, color restraint, how handheld vs smooth vs steady framing is used, lens values stated as full-frame-equivalent.]\n\nREFERENCE USE:\nReference images establish identity, costume or physical design only. Do NOT use any location sheet or character-sheet collage as the starting frame. Begin with the newly staged live shot specified below. Never render reference labels, panels or watermarks. Keep every principal distinct; extras have independent faces, ages and garments.\n\nDIALOGUE AND SOUND RULES:\n[Only the assigned speaker says the quoted line. Acting instructions are silent. No BGM / narrator / subtitles unless wanted. Ambient motion continues during pauses.]\n\nATTACH IN THIS ORDER:\n[Image 1] = [filename]\n[One line: what to preserve — identity, costume, geometry. Voice continuity if relevant.]\n[Image 2] = [filename]\n[...]\n\nOPENING AND PHYSICAL POSITIONS:\n[Where every character and prop is at second 0. State whether this is a continuation or a new location/time.]\n\nFIXED LOCATION GEOGRAPHY:\n[Left/right layout per location from a stated camera position. Doors, hinges, furniture, light direction. \"A change of camera angle never moves an actor.\"]\n\nTIMED SHOTS:\n\n00–07s — Shot 1: [purpose]\n[lens]mm [camera move]. [What is visible, what moves, sound.]\n\n07–12s — Shot 2: [purpose]\n[...]\n\nFINAL STATE:\n[Exact end positions, hands, props, door/gate state, and what belongs to the NEXT clip.]"}]}</script>
<script type="module">
// Pure search over normalized entries. Also inlined into the browser UI.

const tokenize = (s) => s.toLowerCase().split(/[^a-z0-9#+]+/).filter(Boolean);

export function search(entries, query = '', filters = {}) {
  const tokens = tokenize(query);
  const hits = [];
  for (const e of entries) {
    if (filters.category && e.category !== filters.category) continue;
    if (filters.medium && !e.medium.includes(filters.medium)) continue;
    if (filters.model && !(e.models.includes('any') || e.models.includes(filters.model))) continue;
    if (filters.tag && !e.tags.includes(filters.tag)) continue;
    let score = 0;
    let ok = true;
    if (tokens.length) {
      const title = e.title.toLowerCase();
      const id = e.id.toLowerCase();
      const text = `${e.body} ${e.notes || ''}`.toLowerCase();
      for (const t of tokens) {
        let s = 0;
        if (title.includes(t)) s += 5;
        if (e.tags.includes(t)) s += 4;
        else if (e.tags.some((x) => x.includes(t))) s += 2;
        if (e.category.includes(t)) s += 3;
        if (id.includes(t)) s += 1;
        if (text.includes(t)) s += 1;
        if (!s) { ok = false; break; }
        score += s;
      }
    }
    if (ok) hits.push({ e, score });
  }
  hits.sort((a, b) => b.score - a.score || a.e.id.localeCompare(b.e.id));
  return hits.map((h) => h.e);
}

// Pure prompt composer: fragments + model profile -> model-shaped prompt.
// No imports so it can be inlined into the browser UI unchanged.

const ensureEnd = (s) => (/[.!?"')\]]$/.test(s) ? s : `${s}.`);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const stripEnd = (s) => s.replace(/[.\s]+$/, '');

export function fillVars(text, vars) {
  const missing = new Set();
  const out = text.replace(/\{\{\s*([\w-]+)\s*\}\}/g, (m, k) => {
    if (vars[k] != null && vars[k] !== '') return String(vars[k]);
    missing.add(k);
    return m;
  });
  return { text: out, missing: [...missing] };
}

/**
 * @param {object} p
 * @param {object} p.profile  model profile (models/*.json)
 * @param {object[]} p.entries  library entries to combine
 * @param {string} [p.subject]  free-text subject
 * @param {object} [p.vars]  template variables / params (e.g. {ar:'9:16'})
 */
export function compose({ profile, entries, subject = '', vars = {} }) {
  const warnings = [];
  const v = { ...(profile.paramDefaults || {}), ...vars };
  if (subject) v.subject = subject;

  const byCat = new Map();
  const negatives = [];
  let subjectConsumed = false;
  const templates = [];

  for (const e of entries) {
    if (!e.models.includes('any') && !e.models.includes(profile.id)) {
      warnings.push(`"${e.id}" is not tagged for ${profile.id}`);
    }
    if (e.category === 'method') { warnings.push(`"${e.id}" is a method, not a prompt fragment — skipped`); continue; }
    if (e.negative) negatives.push(e.negative);
    if (e.category === 'negative') { negatives.push(e.body); continue; }
    if (e.category === 'template') { templates.push(e); continue; }
    if (!byCat.has(e.category)) byCat.set(e.category, []);
    byCat.get(e.category).push(e.body);
  }

  const blocks = [];
  for (const t of templates) {
    const { text, missing } = fillVars(t.body, v);
    if (/\{\{\s*subject\s*\}\}/.test(t.body)) subjectConsumed = true;
    missing.forEach((k) => warnings.push(`template "${t.id}": variable {{${k}}} left unfilled`));
    blocks.push(text);
  }

  if (subject && !subjectConsumed) {
    if (!byCat.has('subject')) byCat.set('subject', []);
    byCat.get('subject').unshift(subject);
  }

  const order = profile.order || [];
  const extra = [...byCat.keys()].filter((c) => !order.includes(c));
  extra.forEach((c) => warnings.push(`${profile.id} has no slot for "${c}" — appended at the end`));
  for (const cat of [...order, ...extra]) for (const b of byCat.get(cat) || []) blocks.push(b);

  const sentences = profile.style === 'sentences';
  const clean = blocks.map((b) => b.trim().replace(/\s+/g, ' ')).filter(Boolean);
  let prompt = clean.map(sentences ? (b) => cap(ensureEnd(b)) : stripEnd).join(profile.joiner ?? (sentences ? ' ' : ', '));

  let negative = '';
  const neg = profile.negative || { mode: 'none' };
  if (negatives.length) {
    const list = negatives.map(sentences ? (b) => cap(ensureEnd(b)) : stripEnd).join(neg.join ?? (sentences ? ' ' : ', '));
    if (neg.mode === 'inline') prompt += (sentences ? ' ' : ' ') + (neg.template || '{list}').replace('{list}', list);
    else if (neg.mode === 'separate') negative = list;
    else warnings.push(`${profile.id} has no negative prompt — ${negatives.length} avoid-item(s) dropped; phrase them positively instead`);
  }

  if (profile.prefix) prompt = `${profile.prefix} ${prompt}`;
  if (profile.suffix) {
    const { text, missing } = fillVars(profile.suffix, v);
    missing.forEach((k) => warnings.push(`suffix param {{${k}}} left unfilled`));
    prompt += text;
  }

  const words = prompt.split(/\s+/).filter(Boolean).length;
  if (profile.maxWords && words > profile.maxWords) {
    warnings.push(`${words} words exceeds the ${profile.maxWords}-word guideline for ${profile.id} — tighten`);
  }
  return { prompt, negative, warnings, words };
}


const DATA = JSON.parse(document.getElementById('data').textContent);
const { entries, models, taxonomy } = DATA;
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c);
  return el;
};
// replaceChildren() stringifies arrays and null; flatten and drop empties first.
const mount = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false && k !== ''));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('pl.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pl.' + k, JSON.stringify(v)); } catch {} },
};

const state = {
  q: '', category: '', medium: '', tag: '', limit: 100,
  model: store.get('model', models[0]?.id || ''),
  subject: store.get('subject', ''),
  picked: store.get('picked', []).filter((id) => entries.some((e) => e.id === id)),
};
const byId = new Map(entries.map((e) => [e.id, e]));

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = h('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  const old = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => (btn.textContent = old), 1100);
}

function results() {
  const f = { category: state.category, medium: state.medium, tag: state.tag };
  return search(entries, state.q, f);
}

function renderFacets() {
  const base = search(entries, state.q, { medium: state.medium, tag: state.tag });
  const counts = {}; base.forEach((e) => (counts[e.category] = (counts[e.category] || 0) + 1));
  const groups = {};
  for (const [cat, meta] of Object.entries(taxonomy.categories)) (groups[meta.group] ||= []).push([cat, meta]);
  const tagCounts = {};
  search(entries, state.q, { category: state.category, medium: state.medium }).forEach((e) => e.tags.forEach((t) => (tagCounts[t] = (tagCounts[t] || 0) + 1)));
  const topTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 36);
  mount($('facets'),
    h('button', { class: 'facet' + (!state.category ? ' on' : ''), onclick: () => set({ category: '' }) }, h('span', {}, 'All'), h('span', {}, String(base.length))),
    ...Object.entries(groups).flatMap(([g, cats]) => [
      h('h2', {}, g),
      ...cats.map(([cat, meta]) => h('button', { class: 'facet' + (state.category === cat ? ' on' : ''), title: meta.description, onclick: () => set({ category: state.category === cat ? '' : cat }) }, h('span', {}, meta.label), h('span', {}, String(counts[cat] || 0)))),
    ]),
    h('h2', {}, 'Medium'),
    h('div', { class: 'chips' }, ['image', 'video'].map((m) => h('button', { class: 'chip' + (state.medium === m ? ' on' : ''), onclick: () => set({ medium: state.medium === m ? '' : m }) }, m))),
    h('h2', {}, 'Tags'),
    h('div', { class: 'chips' }, topTags.map(([t, n]) => h('button', { class: 'chip' + (state.tag === t ? ' on' : ''), onclick: () => set({ tag: state.tag === t ? '' : t }) }, `${t} ${n}`))),
  );
}

function card(e) {
  const picked = state.picked.includes(e.id);
  const body = h('div', { class: 'body' }, e.body);
  const long = e.body.length > 420 || e.body.split('\n').length > 8;
  return h('div', { class: 'card' },
    h('h3', {}, e.title, h('span', { class: 'cat' }, taxonomy.categories[e.category]?.label || e.category)),
    body,
    long ? h('button', { class: 'btn', onclick: (ev) => { body.classList.toggle('open'); ev.target.textContent = body.classList.contains('open') ? 'Less' : 'More'; } }, 'More') : null,
    e.negative ? h('div', { class: 'neg' }, 'Avoid: ' + e.negative) : null,
    e.notes ? h('div', { class: 'note' }, e.notes) : null,
    h('div', { class: 'meta' },
      e.medium.map((m) => h('span', { class: 'chip' }, m)),
      e.models.map((m) => h('span', { class: 'chip' }, m === 'any' ? 'any model' : m)),
      e.tags.slice(0, 6).map((t) => h('button', { class: 'chip', onclick: () => set({ tag: t }) }, '#' + t)),
      h('span', { class: 'sp' }),
      h('button', { class: 'btn', onclick: (ev) => copy(e.body, ev.target) }, 'Copy'),
      e.category !== 'method' ? h('button', { class: 'btn' + (picked ? '' : ' pri'), onclick: () => togglePick(e.id) }, picked ? 'Remove' : '+ Composer') : null,
    ),
  );
}

function renderResults() {
  const hits = results();
  $('count').textContent = `${hits.length} of ${entries.length} prompts`;
  const el = $('results');
  if (!hits.length) return mount(el, h('div', { class: 'empty' }, 'No prompts match. Clear a filter or try other words.'));
  const shown = hits.slice(0, state.limit);
  mount(el, shown.map(card),
    hits.length > shown.length ? h('button', { class: 'btn', onclick: () => { state.limit += 100; renderResults(); } }, `Show more (${hits.length - shown.length} left)`) : null);
}

function renderComposer() {
  const profile = models.find((m) => m.id === state.model);
  const chosen = state.picked.map((id) => byId.get(id)).filter(Boolean);
  const r = profile ? compose({ profile, entries: chosen, subject: state.subject }) : { prompt: '', negative: '', warnings: [], words: 0 };
  const out = h('textarea', { class: 'out', readonly: '' }); out.value = r.prompt;
  const subj = h('textarea', { rows: '3', placeholder: 'e.g. a tea-stall owner pouring chai at dawn' }); subj.value = state.subject;
  subj.addEventListener('input', () => { state.subject = subj.value; store.set('subject', state.subject); updateOut(); });
  const sel = h('select', { onchange: (ev) => { state.model = ev.target.value; store.set('model', state.model); renderComposer(); } },
    models.map((m) => { const o = h('option', { value: m.id }, `${m.name} (${m.medium.join('/')})`); if (m.id === state.model) o.selected = true; return o; }));
  const warnBox = h('div'), negBox = h('div'), wc = h('div', { class: 'note' });
  function updateOut() {
    const rr = compose({ profile, entries: state.picked.map((id) => byId.get(id)).filter(Boolean), subject: state.subject });
    out.value = rr.prompt;
    wc.textContent = `${rr.words} words`;
    mount(warnBox, rr.warnings.map((w) => h('div', { class: 'warn' }, '⚠ ' + w)));
    mount(negBox, rr.negative ? h('div', {}, h('h2', {}, 'Negative prompt'), h('div', { class: 'out neg' }, rr.negative), h('button', { class: 'btn', onclick: (ev) => copy(rr.negative, ev.target) }, 'Copy negative')) : '');
  }
  mount($('composer'),
    h('h2', {}, 'Composer'),
    sel,
    profile?.notes ? h('div', { class: 'note' }, profile.notes) : null,
    h('h2', {}, 'Subject'), subj,
    h('h2', {}, `Fragments (${chosen.length})`),
    chosen.length ? chosen.map((e) => h('div', { class: 'picked' }, h('span', {}, `${taxonomy.categories[e.category]?.label}: ${e.title}`), h('button', { class: 'chip', onclick: () => togglePick(e.id) }, '✕')))
      : h('div', { class: 'note' }, 'Click “+ Composer” on any fragment — styles, cameras, lighting…'),
    h('h2', {}, 'Prompt'), out, wc, warnBox, negBox,
    h('div', { class: 'meta' },
      h('button', { class: 'btn pri', onclick: (ev) => copy(out.value, ev.target) }, 'Copy prompt'),
      h('button', { class: 'btn', onclick: () => { state.picked = []; store.set('picked', []); state.subject = ''; store.set('subject', ''); renderAll(); } }, 'Clear')),
  );
  updateOut();
}

function togglePick(id) {
  const i = state.picked.indexOf(id);
  if (i >= 0) state.picked.splice(i, 1); else state.picked.push(id);
  store.set('picked', state.picked);
  renderResults(); renderComposer();
}
function set(p) { Object.assign(state, p, { limit: 100 }); renderFacets(); renderResults(); }
function renderAll() { renderFacets(); renderResults(); renderComposer(); }

$('q').addEventListener('input', (ev) => set({ q: ev.target.value }));
renderAll();
</script>
