t","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","clip-08","part-2","mythological","indian","hindi","multi-shot","timed-shots"],"negative":"","notes":"30 seconds | Landscape 16:9 · Current 21-clip edition","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"PART 2 — CLIP 08: The first child is spared\nDuration: 30 seconds | Landscape 16:9\n\nATTACH IN THIS ORDER:\n[Image 1] = vasudev.jpeg\nApproved Vasudev identity and ivory clothing.\n[Image 2] = Kirtiman — newborn.png\nApproved infant identity and swaddle; preserve the actual hold in Video 1.\n[Image 3] = Kans.jpeg\nApproved Kans identity, crown, ornaments and purple lower garment.\n[Image 4] = pralamb.png\nIdentity reference for Pralamb, who remains offscreen throughout this clip. His one line comes from his established position beside the throne.\n[Image 5] = Guard_A.png\nApproved escort guard identity and armour.\n[Image 6] = old courtier.png\nApproved distinct old courtier identity; preserve his established chair.\n[Image 7] = Royal court.png\nArchitecture reference only; footage controls actual staging.\n[Video 1] = 7b.mp4\nPrimary continuity: final positions, distance to throne, infant hold, lighting and costumes.\n\nVISUAL STYLE:\nPhotorealistic live-action Indian mythological cinema. Match Video 1’s warm sandstone, natural skin, tactile cloth and restrained gold. Newly framed live action, never a reference-sheet starting frame. Subtle handheld breathing on human coverage. Live flames, drifting smoke, gentle fabric motion and individual breathing throughout. Distinct seated court population retains its places.\n\nOPENING AND PHYSICAL POSITIONS:\nContinue immediately after Vasudev’s completed vow in 7b.mp4. Vasudev stands below seated Kans, wrists bare, infant supported exactly as in the final frame: head screen-right in that reference view and feet toward screen-left. Preserve anatomical carrying arm through angle changes. Guard A stays behind Vasudev. Kans remains seated throughout this clip. Pralamb remains physically where the reference places him, outside the tighter framing; his reply is heard from that position. The old courtier remains at his established chair.\n\nFIXED LOCATION GEOGRAPHY:\nThrone and steps stay fixed; Vasudev stays on the floor below them. Opening camera is a new near-Vasudev viewpoint toward Kans, offset on the same side of their axis as Video 1. Kans looks toward Vasudev; Vasudev looks slightly upward toward Kans. Frame Pralamb outside all shots rather than moving him. Keep exact support under infant head/neck and hips. Only father and escort depart at the end; baby remains with father throughout.\n\nTIMED SHOTS:\n\n00–03s — Shot 1: The king considers\n65mm near-Vasudev viewpoint looking slightly upward at seated Kans, a new subject and angle from the preceding shot of Vasudev. Frame Kans’s crown, face, chest and throne arms. Kans lowers his eyes toward the infant below frame, blinks and takes a small breath. His fingers adjust on the throne arm. Pralamb is outside this tight composition.\n\n03–07s — Shot 2: A father waits\n75mm medium close-up of Vasudev and infant from the established camera side. Preserve Video 1’s exact hold and swaddle. His jaw tightens, eyes searching Kans’s face; baby breathes against his supporting arm. Kans gives a brief low amused exhale offscreen. Vasudev listens, uncertain, without changing position.\n\n07–13s — Shot 3: The boast\nReturn to the seated Kans angle. His eyes turn briefly toward Pralamb’s established offscreen position; only head and eyes move.\nKANS: \"Dekha, Pralamb? Vasudev ne apna vachan nibhaya!\"\nPronunciation guide: DE-khaa, pra-LAMB? vaa-su-DEV ne AP-naa VA-chan ni-BHAA-yaa!\nEnglish meaning (not spoken): See, Pralamb? Vasudev kept his word.\nActing and response (not spoken): Kans performs generosity for an audience. Lift his chin slightly, let a self-satisfied smile form on vachan nibhaya, and give the phrase confident mocking warmth. His chest and fingers move naturally. Remain seated.\n\n13–16s — Shot 4: The question from beside the throne\nHold on Kans listening, eyes toward Pralamb’s offscreen place. Kans’s lips remain still.\nPRALAMB, OFFSCREEN: \"Aur yeh baalak, Maharaj?\"\nPronunciation guide: aur yeh BAA-lak, ma-ha-RAAJ?\nEnglish meaning (not spoken): And what should happen to the child?\nActing and response (not spoken): Pralamb’s distinct mid-low voice asks respectfully with a questioning inflection. Sound originates from his fixed position beside the throne. Kans’s smile contracts slightly; he returns his eyes toward Vasudev and the infant. Pralamb remains out of frame.\n\n16–26s — Shot 5: The reprieve\n50–65mm seated Kans medium close-up from the same side, addressing Vasudev directly.\nKANS: \"Le jao. Bhay aathve putra se hai, pehle se nahi. Main hatyaara nahi, Vasudev... sirf sachet hoon.\"\nPronunciation guide: le JAA-o. bhay AATH-ve PU-tra se hai, PEH-le se na-HEE. main hat-YAA-raa na-HEE, vaa-su-DEV... sirf sa-CHET hoon.\nEnglish meaning (not spoken): Take him. I fear the eighth son, not the first; I call this caution rather than murder.\nActing and response (not spoken): Give Le jao a small dismissive movement of his empty hand. Aathve carries a brief edge of fear; he masks it with pride on Main hatyaara nahi and ends sachet with cold certainty. Return the hand naturally to the throne arm. Let the whole line finish. Vasudev listens offscreen, continuing to hold the infant.\n\n26–30s — Shot 6: Leave with life\n50mm side medium of Vasudev, infant and Guard A, keeping the throne-side Pralamb position outside the frame. Vasudev’s jaw releases and eyes fill with relief. Guard turns toward the original entrance; Vasudev carefully pivots with the baby and follows for their first two steps. Their departure continues beyond this clip; they do not cross the entire hall in four seconds. Kans remains seated outside the crop.\nOLD COURTIER, OFFSCREEN FROM HIS CHAIR: \"Maharaj ki udaarta ki jai ho.\"\nPronunciation guide: ma-ha-RAAJ kee u-DAAR-taa kee jai ho.\nEnglish meaning (not spoken): Praise the king’s generosity.\nActing and response (not spoken): The old courtier offers deferential public praise from his unchanged chair. Vasudev remains focused on taking his child safely away, with a protective downward glance. Guard leads; father supports baby continuously.\n\nFINAL STATE:\nVasudev and Guard A have turned toward the original entrance and begun leaving, infant still supported in the same hold. Kans remains seated on his throne. Pralamb stays in his original throne-side position offscreen. The old courtier remains at his chair. Clip 9’s later return to the prison remains compatible.\n\nAUDIO:\nOnly assigned speakers deliver quoted lines. Pralamb and old courtier speak offscreen from their fixed positions; visible listeners react silently. Pronunciation guides and English directions remain silent. Natural connected Hindi and distinct voices. Quiet court ambience, footsteps, baby breathing and flame crackle; no background score or captions."},{"id":"full-prompt/vachan-clip-09-a-returned-child-narada-arrives","title":"Vachan Clip 09 — A returned child; Narada arrives","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","clip-09","part-2","mythological","indian","hindi","multi-shot","timed-shots"],"negative":"","notes":"30 seconds | Part 2 04:04–04:34 · Current 21-clip edition","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"PART 2 — CLIP 09: A returned child; Narada arrives\nDuration: 30 seconds | Part 2 04:04–04:34\n\nCreate a photorealistic live-action Indian mythological film sequence, landscape 16:9, real-time human motion except explicit editorial ellipses. Tactile cloth, worn stone/wood, natural skin, subtle film grain, rich restrained colors and readable shadows. Grandness comes from layered depth, human scale, motivated reveals and emotional consequence. Use barely perceptible handheld breathing on human medium/close coverage, smooth movement for wide architectural reveals, steady framing for exact hand/prop contact. Lens values are proposed full-frame-equivalent choices.\n\nREFERENCE USE:\nReference images establish identity, costume or physical design only. Do NOT use any location sheet or character-sheet collage as the starting frame. Begin with the newly staged live shot specified below. Never render reference labels, panels or watermarks. Keep every principal distinct; extras have independent varied faces, ages and garments rather than duplicates of the leads. Preserve real background population through angle changes.\n\nDIALOGUE AND SOUND RULES:\nOnly the assigned speaker says the quoted Roman-Hindi line. Natural Hindi pronunciation, complete words, conversational rhythm and emotion; acting instructions are silent directions. Listeners react with eyes, breath and posture and do not mouth another person's line. Dialogue windows include pauses; finish words before the next speaker begins. No BGM, narrator, subtitles or on-screen text. Only location sound, nonverbal reactions and explicitly established diegetic instruments. Maintain environmental motion even during an emotional pause: breathing, small cloth movement, live flames and drifting smoke where present. No frozen background or slow-motion lip sync.\n\nPERFORMANCE DIRECTION — SILENT ENGLISH INSTRUCTIONS:\nThe English meaning below each spoken line explains the intent; only the quoted Hindi dialogue is audible. Play a thought changing in response to the previous event: notice, react, then speak. The line-specific acting direction sets facial expression, eyeline, vocal delivery and the listener's response. Use one meaningful bodily action at a time within the existing positions; keep occupied hands and infant support fixed. Scale performance to the scene: playful comedy, vulnerable longing, desperate grief, public intimidation and tender celebration have different energies. Keep emotion alive after the last word and carry it into the next shot rather than resetting to a neutral portrait. Use the existing shot time for reaction and breath; these cues add no seconds or new cuts. Phonetic spelling helps pronunciation only; connected Hindi rhythm and emotional phrasing take priority over syllable-by-syllable reading.\n\nPRONUNCIATION USE:\nSpeak each DIALOGUE line once, using its Pronunciation guide only as a silent pronunciation aid. Never speak the words \"Pronunciation guide\" or repeat the guide as a second line. Hyphens separate syllables for guidance; deliver connected, natural Hindi rather than pausing at each hyphen. Capitals highlight articulation and long vowels, not shouting or artificial English stress. Preserve the specified emotion, speaker and existing time window. Keep bh, dh, th, chh and gh as Hindi aspirated consonants; th is not the English sound in \"think\". Preserve nasal vowels in main, mein, hain and hoon. Bhay means fear and is not bhaai (brother).\n\nATTACH IN THIS ORDER:\n[Image 1] = devki.jpg\nDevaki: exact approved face and plain off-white sari/blouse, head pallu, braid, bare ears/neck/wrists except scene-specified prison cuffs, mildly swollen tearful eyelids. Nonpregnant/postpartum body according to action; preserve identity. Voice continuity: Young adult Hindi female voice, clear consonants, restrained breath breaks under grief; words remain intelligible.\n\n[Image 2] = vasudev.jpeg\nVasudev: approved face, dark beard, tied hair with slight silver at temples, beige-ivory dhoti/drape and thin necklace. Barefoot throughout prison/court journey. Keep slight greying fixed, not a new elderly face. Voice continuity: Low adult Hindi male voice, steady but weighted with grief; never confused with Kans's commanding delivery.\n\n[Image 3] = Kirtiman — newborn.png\nKirtiman: sleeping newborn identity and pale-ivory swaddle. Head/neck fully supported whenever carried. Hands may emerge gently from swaddle as specified. Never upright or standing.\n\n[Image 4] = Guard_A.png\nGuard A: approved moustached helmeted guard in bronze chest armour and brown clothing. Speech belongs only to his explicitly assigned lines. Spear handling is specified per shot. Voice continuity: Respectful younger adult Hindi male voice, direct and measured, distinct from Pralamb.\n\n[Image 5] = mathura prison cell.png\nDevaki/Vasudev cell: large dark stone chamber, small high barred window on LEFT wall, low stone sleeping bench on LEFT, rectangular iron double-leaf gate on RIGHT. Gate state determined by action, not open-state still.\n\n[Image 6] = narad.jpg\nNarada: use THIS selected face, long dark beard, beige wrapped headcloth/topknot, cream full-length robe, orange drapes, ornaments and sandals. Preserve photographed reddish-brown veena with long narrow neck, pear-shaped lower body, round upper gourd and pegs. He carries it in anatomical RIGHT hand, lower body beside RIGHT hip. Do not substitute older gray-topknot costume descriptions. Voice continuity: Clear resonant adult Hindi male voice with a light knowing lilt; invocation gently melodic and devotional, warning calm and unhurried.\n\n[Image 7] = Kans.jpeg\nKans: approved broad warrior build, royal gold crown, moustache, long dark hair, heavy gold ornaments, bare upper torso, gold belt, magenta/purple lower cloth. Below crop extend the same cloth to ankles and simple dark sandals. Keep sword sheathed at anatomical LEFT hip; no sword action. Voice continuity: Deep resonant Hindi male voice with controlled authority; amused cruelty gives way to clipped fear and force.\n\n[Image 8] = pralamb.png\nPralamb: exact bearded face, dark tied-back hair, bronze/dark cuirass, dark tunic skirt, red belt and boots. Preserve distinct commander identity. Voice continuity: Rough mid-low adult Hindi male voice, clipped disciplined replies, distinct from Kans.\n\n[Image 9] = old courtier.png\nOld courtier: slender older clean-shaven man, gray topknot, white/red tilak, ochre shoulder drape, ivory dhoti and turquoise bead necklace. Face/clothes only; ignore sheet lettering and tray pose. Voice continuity: Thin older Hindi male voice, deferential public praise.\n\n[Image 10] = Royal court.png\nApproved Part 1 royal court: carved honey sandstone, red axial runner, elevated gold throne, occupied side chairs, upper arcades, tall hanging red banners, practical lamps. Keep this architecture; do not replace with black-stone hall.\n\nOPENING AND PHYSICAL POSITIONS:\nDaylight at prison. Guard A has opened RIGHT gate inward and stands at threshold; Vasudev enters with infant, free wrists. Devaki remains seated LEFT bench, cuffed, startled by their return.\n\nFIXED LOCATION GEOGRAPHY:\nApply each location only in its specified shots. Timed actions determine changing posture, custody, cuffs and gate state. A change of camera angle never moves an actor.\n[Image 5] GEOGRAPHY: Fixed stone bench and high small barred window on LEFT, rectangular double-leaf iron gate on RIGHT. From the doorway looking toward the bench, Devaki's assigned place is toward frame LEFT, Vasudev's beside her on frame RIGHT, nearer the gate. Their posture follows the shot action below. Keep that physical arrangement when framing reverses; do not swap their bodies. Low lamp stands against far wall clear of the route. Cool window light from LEFT, a small amber lamp pool, stone texture and readable faces. When worn, long slack wrist chains connect each prisoner's own cuffs, not the couple to each other; about 60 cm permits sewing, supported infant holding and comforting. Feet are free. No garment tie between them. Gate swings inward toward wall clearances, leaving middle passage clear. Exterior arched gateway is a different gate. Keep bench-to-door walking lane clear. Separate many small day tallies on the window wall from the later six large loss marks beside the bench.\n\n[Image 10] GEOGRAPHY: The royal throne is NORTH, the main entrance SOUTH, the red runner joins them. Camera normally on the EAST side of this axis; visitor appears screen LEFT, Kan  people to empty or private scenes. No frozen bokeh crowd, animated camera over a still background, moving cutout silhouettes or motion limited to flames and smoke.\n\nTIMED SHOTS:\n\n00–06s — Shot 1: Lift with care\n50mm continuous side medium. Nanda takes a short step around the outside of Purohit to the cot’s accessible near-right edge, then bends, slides LEFT forearm under infant head/neck and RIGHT hand beneath hips, gathers swaddle and lifts slowly to his chest. Yashoda steadies the cloth edge then withdraws her hand as Nanda takes the weight. Purohit remains on the right/head side, settled back with his hands on his knees, clear of Nanda’s route. Entire transfer visible; no baby passing through rail.\n\n06–09s — Shot 2: A hopeful image\n40mm low gentle angle, Nanda already holding child chest-high. He raises supported cradle hold only slightly toward shoulder height, keeps head stable. Camera finds warm sunlight behind child through tree leaves, natural soft flare outlines swaddle. No toss or unsupported overhead hold. Guests smile individually; drums swell modestly from doorway.\n\n09–15s — Shot 3: A promise returns\nSCENE STATE AT THIS CUT: Nanda holds Balram securely at chest level, head LEFT elbow. He stands at the near-right edge of the padded cot. Rohini seated LEFT of the cot, Yashoda seated CENTRE behind it, Purohit on the right/head side, Gopi 1 near Rohini; Gopi2/Villager1 left guest group. Children dance at outer edge only. Personal cradle remains empty under veranda LEFT.\n65mm Nanda warmly addresses gathering then glances toward Yashoda. 09–15s Nanda: \"Suno, Gokul vaasiyo! Ek kilkaari kabhi akeli nahi aati.\"\nPronunciation guide: SU-no, GO-kul VAA-si-yo! ek kil-KAA-ree ka-BHEE a-KE-lee na-HEE AA-tee.\nEnglish meaning (not spoken): Listen, Gokul: one child’s laughter brings hope of another.\nActing and response (not spoken): Nanda shares joy with the crowd while privately reassuring Yashoda. Look outward for Suno, then briefly toward her on akeli nahi aati; voice full and welcoming, eyes soften at the private meaning. Keep the infant head securely supported, expressing joy through face and voice. Yashoda catches the glance and hope returns to her eyes.\n\nHis smile offers private hope rather than inviting mockery of her longing. Infant remains supported.\n\n15–18s — Shot 4: A friendly tease\n65mm Villager 1 from fixed left guest group, looks toward Nanda. 15–18s Villager 1: \"Nandbaba aaj se jyotishi ban gaye!\"\nPronunciation guide: NAND-baa-baa aaj se JYO-ti-shee ban GA-ye!\nEnglish meaning (not spoken): Nandbaba has become an astrologer today!\nActing and response (not spoken): Villager 1 makes an affectionate joke from his fixed place. Raise brows, smile toward Nanda and give jyotishi a playful lilt. Finish with a soft chuckle. Nearby guests exchange warm smiles at different moments; Nanda’s grin broadens without moving the baby.\n\nGopi 2 beside him smiles, stays silent.\n\n18–22s — Shot 5: Conviction\n65mm Nanda, eyes briefly toward Yashoda before gathering. 18–22s Nanda: \"Aaj toh jo bol doon, wahi sach hoga!\"\nPronunciation guide: aaj to jo bol doon, wa-HEE sach HO-gaa!\nEnglish meaning (not spoken): Whatever I say today will surely come true!\nActing and response (not spoken): Nanda answers the tease with joyful confidence. Eyes brighten, chin lifts slightly and a warm laugh colors the opening. Briefly find Yashoda’s eyes on sach hoga before looking back to gathering. Preserve both arms supporting infant; Yashoda smiles with shy, renewed hope rather than laughing broadly.\n\nCut to Yashoda listening within shot end: small blush and hopeful smile, no sudden pregnancy change.\n\n22–27s — Shot 6: Return to mother\n50mm continuous side medium. Nanda lowers child into seated Rohini's supported forearms on the LEFT, after taking a careful step along the clear near edge of the cot, head into her LEFT elbow; waits until both arms take weight, then releases. Yashoda steadies swaddle edge only. Baby ends with Rohini, cradle empty.\n\n27–30s — Shot 7: A future waiting\n65mm personal empty cradle under veranda LEFT, folded cloth in foreground; celebration and family alive softly behind. Slow very small push, cloth corner stirs. Infant coo from Rohini offscreen merges with nearby laughter and live drums. End in living warmth, no freeze or on-screen title.\n\nFINAL STATE:\nBalram is back in seated Rohini’s supported arms, head in LEFT elbow; Nanda has released after confirming support. Ceremonial cradle is empty. Personal empty cradle remains under veranda LEFT. Celebration continues in depth with live foliage, cloth, voices and visible drummers; Yashoda holds quiet hope."},{"id":"lens/100mm-macro","title":"100mm Macro","category":"lens","medium":["image","video"],"models":["any"],"tags":["macro","100mm","detail","shallow-dof"],"negative":"","notes":"","source":"","body":"100mm macro lens, life-size detail, paper-thin focus plane"},{"id":"lens/135mm-telephoto","title":"135mm Telephoto","category":"lens","medium":["image","video"],"models":["any"],"tags":["135mm","telephoto","compression"],"negative":"","notes":"","source":"","body":"135mm telephoto lens, compressed background layers, isolated subject"},{"id":"lens/14mm-ultra-wide","title":"14mm Ultra Wide","category":"lens","medium":["image","video"],"models":["any"],"tags":["ultra-wide","14mm","distortion","architecture"],"negative":"","notes":"","source":"","body":"14mm ultra-wide lens, strong perspective stretch, dramatic converging lines"},{"id":"lens/24mm-wide","title":"24mm Wide","category":"lens","medium":["image","video"],"models":["any"],"tags":["wide","24mm","environment"],"negative":"","notes":"","source":"","body":"24mm wide-angle lens, expansive view with moderate perspective exaggeration"},{"id":"lens/35mm-natural","title":"35mm Natural","category":"lens","medium":["image","video"],"models":["any"],"tags":["35mm","natural","street","cinematic"],"negative":"","notes":"","source":"","body":"35mm lens, natural ody":"tilt-shift lens effect, narrow band of focus, scene looks like a miniature model"},{"id":"lighting/bare-bulb-overhead","title":"Bare Bulb Overhead","category":"lighting","medium":["image","video"],"models":["any"],"tags":["bulb","overhead","hard","tense"],"negative":"","notes":"","source":"","body":"single bare bulb hanging overhead, hard pool of light on the floor, dark corners, interrogation-room mood"},{"id":"lighting/blue-hour","title":"Blue Hour","category":"lighting","medium":["image","video"],"models":["any"],"tags":["blue-hour","twilight","cool","dusk"],"negative":"","notes":"","source":"","body":"blue hour twilight, deep cobalt ambient light, warm practical lights glowing in the distance"},{"id":"lighting/butterfly-beauty","title":"Butterfly Beauty","category":"lighting","medium":["image","video"],"models":["any"],"tags":["butterfly","beauty","portrait","studio"],"negative":"","notes":"","source":"","body":"butterfly lighting, key light high and centered in front, small shadow under the nose, glamorous and even"},{"id":"lighting/candlelight","title":"Candlelight","category":"lighting","medium":["image","video"],"models":["any"],"tags":["candle","warm","flicker","intimate"],"negative":"","notes":"","source":"","body":"candlelight, flickering warm orange glow, deep shadows beyond a small pool of light, intimate"},{"id":"lighting/chiaroscuro","title":"Chiaroscuro","category":"lighting","medium":["image","video"],"models":["any"],"tags":["chiaroscuro","dramatic","baroque","contrast"],"negative":"","notes":"","source":"","body":"chiaroscuro, strong directional light from one side, deep black shadows, subject emerging from darkness"},{"id":"lighting/dawn-haze-amber","title":"Dawn Haze Amber","category":"lighting","medium":["image","video"],"models":["any"],"tags":["dawn","haze","amber","smoke","indian"],"negative":"","notes":"","source":"","body":"early-morning amber haze, low sun filtering through dust and cooking smoke, warm backlit atmosphere"},{"id":"lighting/foggy-diffuse","title":"Foggy Diffuse","category":"lighting","medium":["image","video"],"models":["any"],"tags":["fog","diffuse","misty","atmosphere"],"negative":"","notes":"","source":"","body":"dense fog scattering the light, low contrast, soft glowing sources, muted distance"},{"id":"lighting/golden-hour","title":"Golden Hour","category":"lighting","medium":["image","video"],"models":["any"],"tags":["golden-hour","warm","sunset","natural"],"negative":"","notes":"","source":"","body":"golden hour sunlight, low warm sun raking across the scene, long soft shadows, honey-colored highlights"},{"id":"lighting/hard-direct-flash","title":"Hard Direct Flash","category":"lighting","medium":["image","video"],"models":["any"],"tags":["flash","hard","snapshot","paparazzi"],"negative":"","notes":"","source":"","body":"on-camera direct flash, hard frontal light, harsh shadow behind the subject, snapshot energy"},{"id":"lighting/harsh-midday-sun","title":"Harsh Midday Sun","category":"lighting","medium":["image","video"],"models":["any"],"tags":["harsh","noon","hard-light","desert"],"negative":"","notes":"","source":"","body":"harsh midday sun directly overhead, hard short shadows, high contrast, bleached highlights"},{"id":"lighting/moonlight","title":"Moonlight","category":"lighting","medium":["image","video"],"models":["any"],"tags":["moonlight","night","cool","quiet"],"negative":"","notes":"","source":"","body":"cool moonlight from above, silver-blue highlights, deep soft shadows, quiet night atmosphere"},{"id":"lighting/neon-night","title":"Neon Night","category":"lighting","medium":["image","video"],"models":["any"],"tags":["neon","night","colored","cyberpunk"],"negative":"","notes":"","source":"","body":"night scene lit by colored neon signs, magenta and cyan light spilling onto faces and wet surfaces"},{"id":"lighting/overcast-soft","title":"Overcast Soft","category":"lighting","medium":["image","video"],"models":["any"],"tags":["overcast","soft","diffuse","natural"],"negative":"","notes":"","source":"","body":"soft overcast daylight, large diffuse light source, gentle shadows, even skin tones"},{"id":"lighting/practical-lamp-warm","title":"Practical Lamp Warm","category":"lighting","medium":["image","video"],"models":["any"],"tags":["practical","tungsten","warm","interior"],"negative":"","notes":"","source":"","body":"warm tungsten practical lamps in frame as the only light sources, cozy pools of light"},{"id":"lighting/rainy-night-reflections","title":"Rainy Night Reflections","category":"lighting","medium":["image","video"],"models":["any"],"tags":["rain","night","reflections","wet"],"negative":"","notes":"","source":"","body":"rainy night, wet pavement mirroring headlights and shop signs, streaks of light, soft halos"},{"id":"lighting/rembrandt","title":"Rembrandt","category":"lighting","medium":["image","video"],"models":["any"],"tags":["rembrandt","portrait","classic","studio"],"negative":"","notes":"","source":"","body":"Rembrandt lighting, key light from 45 degrees producing a small triangle of light on the shadow-side cheek"},{"id":"lighting/rim-backlight","title":"Rim Backlight","category":"lighting","medium":["image","video"],"models":["any"],"tags":["rim-light","backlight","separation","edge"],"negative":"","notes":"","source":"","body":"strong rim backlight outlining the subject with a bright edge, subject front-lit softly by fill"},{"id":"lighting/silhouette","title":"Silhouette","category":"lighting","medium":["image","video"],"models":["any"],"tags":["silhouette","backlit","shape","sunset"],"negative":"","notes":"","source":"","body":"subject in full silhouette against a bright sky, no facial detail, bold shape against glow"},{"id":"lighting/soft-window-light","title":"Soft Window Light","category":"lighting","medium":["image","video"],"models":["any"],"tags":["window","soft","natural","interior"],"negative":"","notes":"","source":"","body":"soft directional window light from the side, gentle falloff into shadow, calm domestic feel"},{"id":"lighting/split-lighting","title":"Split Lighting","category":"lighting","medium":["image","video"],"models":["any"],"tags":["split","dramatic","portrait","contrast"],"negative":"","notes":"","source":"","body":"split lighting, one half of the face lit and the other half in deep shadow, dramatic duality"},{"id":"lighting/studio-softbox","title":"Studio Softbox","category":"lighting","medium":["image","video"],"models":["any"],"tags":["studio","softbox","product","clean"],"negative":"","notes":"","source":"","body":"clean studio softbox lighting, large soft key with white fill card, controlled reflections, seamless backdrop"},{"id":"lighting/underlighting-horror","title":"Underlighting Horror","category":"lighting","medium":["image","video"],"models":["any"],"tags":["underlight","horror","eerie","dramatic"],"negative":"","notes":"","source":"","body":"harsh underlighting from below, distorted upward shadows across the face, unsettling"},{"id":"lighting/volumetric-god-rays","title":"Volumetric God Rays","category":"lighting","medium":["image","video"],"models":["any"],"tags":["volumetric","god-rays","atmosphere","beams"],"negative":"","notes":"","source":"","body":"volumetric light shafts cutting through dust or mist, visible beams from a high window or canopy"},{"id":"method/15-second-block-structure","title":"15-Second Block Structure","category":"method","medium":["image","video"],"models":["any"],"tags":["seedance","15-seconds","structure","block"],"negative":"","notes":"","source":"creator-handover-guide","body":"Beginning — where the camera and characters are at the start\nMain action — the most important thing that happens\nEnd — a clear final state that can connect to the next shot\n\nIf a block contains too many unrelated actions, divide the story into more shots. Give the model a sequence it can actually execute."},{"id":"method/appearance-variant-chain","title":"Appearance Variant Chain","category":"method","medium":["image"],"models":["any"],"tags":["character-sheet","variant","aging","workflow","continuity","order"],"negative":"","notes":"Pregnant → postpartum → years-later style chains.","source":"vachan production prompts (generalized)","body":"1. Lock the base identity sheet first.\n2. Generate variants in story order, attaching the approved base (or the previous variant) each time.\n3. State what to preserve, what to change, and what must stay unchanged — in three explicit lists.\n4. Treat wear, aging (years) and retained jewelry as provisional until accepted renders are checked against the final script.\n5. Put restraints that are wearable (cuffs, slack chain) on the sheet; put lock states and tethers in the video prompt.\n6. Keep each variant's face recognisable as the same person; change posture, expression, wear — not bone structure."},{"id":"method/camera-matches-emotion","title":"Camera Matches Emotion","category":"method","medium":["video"],"models":["higgsfield","seedance-2"],"tags":["camera","emotion","handheld","direction"],"negative":"","notes":"","source":"higgsfield-camera skill","body":"Anger / tension → jittery handheld, small irregular micro-twitches, no stabiliser\nCalm / control → smooth handheld breathing, steady rhythm\nSadness / vulnerability → slow, low handheld, slight downward drift\nShock / revelation → static, sharp freeze, then very slow push-in or pull-out\nAction → 60fps, 180° shutter, clean motion blur\nFinal beat / verdict → top-shot freeze, 0.3-0.5s\nEmotional breakdown → slow pull-back from close to wide (\"leave the character alone\")\n\nIf the emotion changes within a take, write named phases and change the camera with it."},{"id":"method/casting-lock-table","title":"Casting Lock Table","category":"method","medium":["image","video"],"models":["any"],"tags":["casting","character","consistency","identity"],"negative":"","notes":"","source":"creator-handover-guide","body":"Before generating many scenes, lock each recurring character's:\n- Face — the same person stays recognisable\n- Hair — changes make the character feel different\n- Skin tone — keeps the character consistent\n- Body / proportions — prevents shape drift\n- Costume foundation — a consistent base look\n- Overall appearance — one clear reference for the show\n\nFor recurring characters the reference image is the identity anchor."},{"id":"method/choosing-the-shot-by-story-need","title":"Choosing the Shot by Story Need","category":"method","medium":["image","video"],"models":["any"],"tags":["shot-selection","coverage","storytelling","cheat-sheet"],"negative":"","notes":"","source":"creator-handover-guide","body":"Ask: \"If I could not use words here, what would I show the audience?\"\n\nWhere we are → wide or aerial establishing shot\nWho is with whom → two-shot / medium shot\nA character's reaction → close-up\nA specific object or clue → detail / insert shot\nSomeone travelling → vehicle / movement shot\nA reveal → controlled camera move, or a shot that hides then reveals\nA change in perspective → POV / inside-vehicle / over-the-shoulder\n\nThese are ways of thinking about what information the viewer needs, not rules."},{"id":"method/common-beginner-mistakes","title":"Common Beginner Mistakes","category":"method","medium":["image","video"],"models":["any"],"tags":["mistakes","beginner","pitfalls"],"negative":"","notes":"","source":"creator-handover-guide","body":"- Starting with a prompt before understanding the scene.\n- Trying to make every shot spectacular instead of readable.\n- Changing a character's face because one generation looks nicer.\n- Putting several unrelated actions into one shot.\n- Vague instructions (\"make it emotional\") without describing what the person does.\n- Saying \"cinematic\" without explaining the actual camera.\n- Adding random background characters or objects.\n- Changing a recurring location from shot to shot.\n- Trying to fix five problems at the same time.\n- Keeping a beautiful shot that tells the story incorrectly."},{"id":"method/continuity-check-after-every-generation","title":"Continuity Check After Every Generation","category":"method","medium":["image","video"],"models":["any"],"tags":["continuity","qa","checklist","review"],"negative":"","notes":"","source":"creator-handover-guide","body":"Character — same face, hair, body, overall appearance\nCostume — matches the script and nearby shots\nLocation — still feels like the same place\nLighting — makes sense for the scene and time\nProps — important objects stay consistent\nPosition — the action makes sense from the previous shot\nStory — the shot communicates the intended beat\nPerformance — the intended level of emotion\nPhysics — bodies and objects move naturally"},{"id":"method/devgarh-sequence-shot-logic","title":"Devgarh Sequence Shot Logic","category":"method","medium":["image","video"],"models":["any"],"tags":["sequence","shot-logic","example","indian"],"negative":"","notes":"","source":"creator-handover-guide","body":"1. Establish the world — wide establishing view (location, scale, weather, time)\n2. World → people — character-focused view\n3. Show the relationship — two-character interaction\n4. Use movement to connect locations — vehicle / transition\n5. Change the point of view — interior vehicle view\n6. Let ordinary details build the location — rural location\n7. Give the important face attention — close-up\n8. Establish the room before the emotional close-up — room / situation\n9. Let the face carry the tension — emotional close-up (or: objects tell the story, overhead)\n10. Show an important object clearly — detail / evidence\n11. Give a small physical action its own moment — action detail\n12. Return to the character's perspective — interior character view\n\nEach shot is chosen for what it communicates, not only because it looks good."},{"id":"method/dialogue-and-pronunciation-rules","title":"Dialogue and Pronunciation Rules","category":"method","medium":["video"],"models":["seedance-2"],"tags":["dialogue","pronunciation","hindi","speech","audio","rules"],"negative":"","notes":"Written for Hindi; the structure (guide / meaning / acting, all silent) works for any language the model struggles with.","source":"vachan production prompts (generalized)","body":"- Only the assigned speaker says the quoted line. Listeners react with eyes, breath and posture and do not mouth another person's line.\n- Speak each line once. The pronunciation guide, English meaning and acting notes are silent — never spoken or repeated as a second line.\n- Hyphens separate syllables for guidance; deliver connected natural speech, not syllable-by-syllable. Capitals mark articulation and long vowels, not shouting.\n- Keep aspirated consonants (bh, dh, th, chh, gh); \"th\" is not the English sound in \"think\". Preserve nasal vowels (main, mein, hain, hoon).\n- Dialogue windows include pauses; finish words before the next speaker begins.\n- Ambient motion continues during emotional pauses: breathing, cloth, flames, smoke. No slow-motion lip sync.\n- Emotion is a thought changing in response to the previous event: notice, react, then speak."},{"id":"method/edit-the-story","title":"Edit the Story","category":"method","medium":["image","video"],"models":["any"],"tags":["editing","selects","viewer-test"],"negative":"","notes":"","source":"creator-handover-guide","body":"- Choose the take that communicates the story best.\n- Wide shots establish place and relationships.\n- Close-ups when the audience needs to notice a face or reaction.\n- Detail shots when an object or clue matters.\n- Movement shots connect locations or create transitions.\n- Dialogue, ambience and music connect the visual pieces.\n- Remove shots that look good but slow down or confuse the story.\n\nViewer test: do I understand what is happening? Do I know where I am? Do I know who matters? Do I know what to notice?"},{"id":"method/final-state-handoff-between-clips","title":"Final State Handoff Between Clips","category":"method","medium":["video"],"models":["seedance-2"],"tags":["continuity","handoff","final-state","sequence","multi-clip"],"negative":"","notes":"Chains 30-second clips into one continuous sequence.","source":"vachan production prompts (generalized)","body":"Every clip ends with FINAL STATE: exact positions, hands, held props, door/gate state, and the camera viewpoint of the last frame.\nThe next clip's OPENING AND PHYSICAL POSITIONS restates that state as its starting condition (\"Immediate continuation: ...\").\nSay explicitly what belongs to the next clip (\"gate opening belongs to Clip 14\", \"nobody retrieves the cloth in this clip\") so the model does not resolve the cliffhanger early.\nIf the previous render exists, attach it as a continuity reference and say which axis it carries (world, action energy, camera feel) — it cannot continue a specific action frame by frame.\nAfter a location or time change, say so in the opening (\"a location/time change, not the same night continuing\")."},{"id":"method/fix-the-specific-problem","title":"Fix the Specific Problem","category":"method","medium":["image","video"],"models":["any"],"tags":["troubleshooting","fix","iteration","debug"],"negative":"","notes":"","source":"creator-handover-guide","body":"Wrong face → strengthen the character reference / identity instruction\nWrong costume → make the costume requirement clearer\nWrong action → simplify the action and describe the sequence\nWrong camera → describe the starting position and exact movement\nObject moves incorrectly → describe cause → direction → contact → final position\nToo many people / objects → remove them and explicitly say no extra characters/objects\nToo much acting → tell the character to stay calm, subtle or serious\nLooks too artificial → improve natural materials, lighting, depth and physical behaviour\nShot doesn't tell the story → go back to the script and reconsider what needs to be shown\n\nChange one thing at a time."},{"id":"method/hero-frame-first","title":"Hero Frame First","category":"method","medium":["image","video"],"models":["any"],"tags":["hero-frame","credits","workflow","image-first"],"negative":"","notes":"","source":"higgsfield-assist skill","body":"1. Generate 5-10 cheap image variations; pick the closest.\n2. Refine that one image (inpaint / edit) until it is exactly right.\n3. Animate ONCE from the approved hero frame.\n\nSpend more on cheap image generations, far less on expensive video re-rolls. Change one variable at a time between generations."},{"id":"method/infant-handling-continuity","title":"Infant Handling Continuity","category":"method","medium":["video"],"models":["seedance-2"],"tags":["infant","baby","safety","handover","continuity","props"],"negative":"","notes":"Reduces the most common failure modes (limb distortion, teleporting baby, swaddle changes).","source":"vachan production prompts (generalized)","body":"- Keep head/neck and hip support continuous in every shot; preserve head-to-feet orientation across cuts.\n- One handover only, directly from carrier A to carrier B; a third person may reach but never takes ownership.\n- Convey force through authority and the parent's distress, never by tugging the infant's limbs or neck.\n- Keep a separate keepsake or cloth visibly distinct from the swaddle and track who holds it and where it lands.\n- Close-ups on the infant crop the same ongoing action; swaddle unchanged."},{"id":"method/keep-the-language-physical","title":"Keep the Language Physical","category":"method","medium":["image","video"],"models":["any"],"tags":["prompting","physical","language","emotion"],"negative":"","notes":"","source":"creator-handover-guide","body":"Models respond to what a person, camera or object actually does.\n\"He looks powerful\" is weak. Describe posture, expression, movement and framing instead: \"He sits upright, shoulders square, chin level, eyes steady on the door; the camera is low and slowly pushes in.\"\n\nReplace: \"make it emotional\" → what the person's face and body do. \"Cinematic\" → the actual camera."},{"id":"method/keep-the-world-consistent","title":"Keep the World Consistent","category":"method","medium":["image","video"],"models":["any"],"tags":["world","continuity","location","props"],"negative":"","notes":"","source":"creator-handover-guide","body":"- Identify recurring locations.\n- Identify important vehicles and objects.\n- Keep the visual language of recurring places consistent.\n- If the story has a specific time of day, keep the lighting believable across nearby shots.\n- Only change a location when the story says the location has changed.\n\nA consistent character in a house, road or vehicle that changes every shot still feels wrong."},{"id":"method/live-background-performance","title":"Live Background Performance","category":"method","medium":["video"],"models":["seedance-2"],"tags":["extras","background","crowd","realism","bokeh","motion"],"negative":"","notes":"Paste as one paragraph into any prompt with seated or standing extras.","source":"vachan production prompts (generalized)","body":"Every visible background person is a live performer, not a still image. Start each shot with activity already in progress. Soft focus changes detail, never motion. In a 6-10 second populated shot, let one or two extras complete different small actions at separate moments (a head turn, shoulder settling, a hand sliding from knee to chair arm) while the others breathe naturally. For shorter cuts, carry an action across the cut. Keep activity quieter than the speaker. No synchronized nodding, repeated loops, newly invented speech, frozen bokeh crowds, or motion limited to flames and smoke. Do not add people to empty or private scenes."},{"id":"method/make-the-visual-not-a-storyboard","title":"Make the Visual, Not a Storyboard","category":"method","medium":["image","video"],"models":["any"],"tags":["storyboard","workflow","hero-frame","image-first"],"negative":"","notes":"","source":"creator-handover-guide","body":"Traditional storyboard → my process\nDraw the shot → visualise the shot in words\nLock the drawing → generate the visual\nAdjust the drawing → adjust the prompt / reference\nShoot from the drawing → use the approved visual as the target for the video generation\n\nA generated frame is easier for non-filmmakers to understand than a sketch."},{"id":"method/one-move-camera-rule","title":"One-Move Camera Rule","category":"method","medium":["video"],"models":["higgsfield","seedance-2"],"tags":["camera","rule","jitter","higgsfield"],"negative":"","notes":"","source":"higgsfield-camera skill","body":"Specify ONE primary camera move per shot. Stacking moves (dolly + pan + tilt) is the leading cause of jitter, unwanted rotation and failed generations.\n\nWrong: \"dolly push forward while panning left and tilting up to reveal the skyline\"\nRight: \"slow dolly push from medium shot to tight close-up over 8 seconds\"\n\nNeed several moves? Split into separate shots, or state a timed sequence (\"pans left 0-3s, holds, pushes in 4-8s\")."},{"id":"method/production-prompt-anatomy","title":"Production Prompt Anatomy","category":"method","medium":["video"],"models":["seedance-2"],"tags":["production","structure","blocks","checklist","seedance"],"negative":"","notes":"Full stack is heavy on purpose. Do not use it for simple one-person shots.","source":"vachan production prompts (generalized)","body":"Each block of a production clip prompt prevents one failure:\nGLOBAL LOOK → style drift\nREFERENCE USE → sheets rendered as frames, labels, watermarks\nDIALOGUE AND SOUND RULES → wrong speaker, double speech, unwanted music or captions\nATTACH IN THIS ORDER → identity swaps\nOPENING AND PHYSICAL POSITIONS → state at second 0\nFIXED LOCATION GEOGRAPHY → left/right flips and teleporting actors\nCAMERA AND ACTION CONTINUITY → moving actors when the camera changes\nLIVE BACKGROUND PERFORMANCE → frozen extras\nTIMED SHOTS → pacing, one dominant action per shot, lens per shot\nFINAL STATE → clip-to-clip handoff\n\nUse the whole stack for long multi-character clips; for simple shots use the short templates instead."},{"id":"method/prompting-rule-say-only-what-matters","title":"Prompting Rule: Say Only What Matters","category":"method","medium":["image","video"],"models":["any"],"tags":["prompting","length","rule"],"negative":"","notes":"","source":"creator-handover-guide","body":"If it is important to the shot, write it clearly. If it is not important, do not add it just to make the prompt longer.\n\nSimple shot (one person sitting and speaking): a short prompt is enough.\nDetailed shot (camera moves + dialogue + object interaction + timing + reaction): many variables must happen in order, so more explicit instructions reduce ambiguity.\n\nWrite as much as the shot needs, not as much as possible."},{"id":"method/realism-checklist","title":"Realism Checklist","category":"method","medium":["image","video"],"models":["any"],"tags":["realism","checklist","photoreal","quality"],"negative":"","notes":"","source":"creator-handover-guide","body":"- Natural skin texture.\n- Realistic fabric, glass, metal, walls, roads and other materials.\n- Lighting that belongs to the location and time of day.\n- Natural depth between foreground, subject and background.\n- Small imperfections instead of perfect surfaces everywhere.\n- Simple, believable body movement.\n- Objects having weight and interacting correctly with the environment.\n- Avoiding unnecessary visual effects.\n\nThe test: \"Could a real camera have captured this?\""},{"id":"method/reference-use-rules","title":"Reference Use Rules","category":"method","medium":["video"],"models":["seedance-2"],"tags":["references","identity","attachments","character-sheet","rules"],"negative":"","notes":"Pairs with template/timed-multi-shot-clip-prompt.","source":"vachan production prompts (generalized)","body":"- Attach references in a stated order and label each: [Image N] = filename, then one line saying what to preserve (identity, costume, location geometry).\n- Sheets establish identity and design only — never use a sheet or collage as the starting frame. Never render labels, panels or watermarks.\n- Add voice continuity per character in the attach line (age, register, energy) so voices stay distinct.\n- Keep principals distinct from each other and from extras; say how two similar characters differ.\n- Location sheets are geometry masters: preserve doors, trees, steps and pillars across coverage.\n- A video reference carries world, texture and camera feel, not exact identity; pair it with an image reference for faces."},{"id":"method/reference-video-jobs","title":"Reference Video Jobs","category":"method","medium":["video"],"models":["higgsfield","seedance-2"],"tags":["reference","video-reference","continuity"],"negative":"","notes":"","source":"higgsfield-camera skill","body":"Tell the model which axis of the reference matters:\n- World continuity: same set construction, lighting logic, atmosphere, production quality\n- Action energy: same event still in progress, same intensity and physical weight\n- Camera character: same cinematic register, operator presence, overall quality\n- Voice + performance: same vocal character, delivery register, energy\n\nPrompt wins on action; reference wins on texture and world feel. Pair with an image reference when character identity matters."},{"id":"method/scene-understanding-questions","title":"Scene Understanding Questions","category":"method","medium":["image","video"],"models":["any"],"tags":["script","questions","planning","scene"],"negative":"","notes":"","source":"creator-handover-guide","body":"For each scene, ask:\n- Who is there?\n- Where are they?\n- What is happening?\n- What does the audience need to understand?\n- What is the most important action?\n- What should the audience notice?\n- What is the emotional tone?\n- What needs to match the next or previous shot?\n\nThen split into visual moments: one visual moment = one thing the audience needs to see."},{"id":"method/script-to-video-workflow","title":"Script to Video Workflow","category":"method","medium":["image","video"],"models":["any"],"tags":["workflow","process","script","pipeline"],"negative":"","notes":"","source":"creator-handover-guide","body":"SCRIPT → UNDERSTAND THE SCENE → CAST THE CHARACTERS → MAKE CHARACTER SHEETS → IDENTIFY LOCATIONS / OBJECTS → BREAK THE STORY INTO VISUAL MOMENTS → DECIDE WHAT EACH SHOT SHOULD SHOW → WRITE THE PROMPT → GENERATE → CHECK → FIX → EDIT\n\nUse the character reference for casting and identity; explain the rest (location, action, camera, lighting, dialogue, movement) directly in the prompt. The generated visuals replace a traditional storyboard."},{"id":"method/spatial-lock-left-right-geography","title":"Spatial Lock Left-Right Geography","category":"method","medium":["video"],"models":["seedance-2"],"tags":["geography","blocking","left-right","continuity","axis","spatial"],"negative":"","notes":"The single most useful habit for multi-shot generations with several characters.","source":"vachan production prompts (generalized)","body":"1. Declare every location's layout once, from a stated camera position: what is on the LEFT, what is on the RIGHT, where entrances and light sources are.\n2. Use capitalised LEFT / RIGHT and say whose left (anatomical vs frame) when it matters.\n3. \"A change of camera angle never moves an actor.\" A closer view crops the existing arrangement.\n4. Keep the camera on one side of the axis within a scene; for dialogue place the listener on the speaker's established eyeline and keep a listener shoulder or landmark in frame.\n5. Movement finishes in the stated destination before the next action begins.\n6. Apply each location's geography only in the shots where that location appears.\n7. Restate seats, standing places, facing directions, occupied hands and object ownership before each cut."},{"id":"method/vachan-21-clip-plan","title":"Vachan 21-Clip Plan","category":"method","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","plan","timeline","part-2","clip-plan"],"negative":"","notes":"Written-plan total 634s (10:34). Clip 7 is 34s, all others 30s.","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"| Clip | Part 2 time | Duration | Scene |\n|---|---|---|---|\n| 01 | 00:00–00:30 | 30 sec | Gokul awakens; a request for butter |\n| 02 | 00:30–01:00 | 30 sec | The children negotiate; Nanda arrives |\n| 03 | 01:00–01:30 | 30 sec | An empty cradle; a distant prison |\n| 04 | 01:30–02:00 | 30 sec | A mother prepares despite fear |\n| 05 | 02:00–02:30 | 30 sec | A first birth behind bars |\n| 06 | 02:30–03:00 | 30 sec | One night pleaded for |\n| 07 | 03:00–03:34 | 34 sec | Free hands carry a difficult promise |\n| 08 | 03:34–04:04 | 30 sec | The king grants a reprieve |\n| 09 | 04:04–04:34 | 30 sec | A returned child; Narada arrives |\n| 10 | 04:34–05:04 | 30 sec | A warning beneath royal grandeur |\n| 11 | 05:04–05:34 | 30 sec | Eight marks unsettle a king |\n| 12 | 05:34–06:04 | 30 sec | Denial becomes a command |\n| 13 | 06:04–06:34 | 30 sec | The command reaches the cell |\n| 14 | 06:34–07:04 | 30 sec | Separation at the prison gate |\n| 15 | 07:04–07:34 | 30 sec | One keepsake becomes six |\n| 16 | 07:34–08:04 | 30 sec | Ugrasena in the adjoining cell; the seventh storm |\n| 17 | 08:04–08:34 | 30 sec | Life sheltered elsewhere |\n| 18 | 08:34–09:04 | 30 sec | A false victory; weeks bring a birth |\n| 19 | 09:04–09:34 | 30 sec | Gokul gathers around the cradle |\n| 20 | 09:34–10:04 | 30 sec | A name and a mother’s gratitude |\n| 21 | 10:04–10:34 | 30 sec | The child is lifted; hope returns |\n\nEvery clip follows the structure in template/timed-multi-shot-clip-prompt."},{"id":"mood/calm-controlled-menace","title":"Calm Controlled Menace","category":"mood","medium":["image","video"],"models":["any"],"tags":["menace","villain","controlled","calm"],"negative":"","notes":"","source":"","body":"calm controlled menace, minimal movement, steady gaze, restrained voice, expensive stillness"},{"id":"mood/chaotic-energy","title":"Chaotic Energy","category":"mood","medium":["image","video"],"models":["any"],"tags":["chaotic","energy","crowd","action"],"negative":"","notes":"","source":"","body":"chaotic energy, overlapping motion, crowded frame, sharp sudden movements"},{"id":"mood/eerie","title":"Eerie","category":"mood","medium":["image","video"],"models":["any"],"tags":["eerie","uncanny","horror","unsettling"],"negative":"","notes":"","source":"","body":"eerie and uncanny, too-still air, faint unexplained details at the edge of the frame"},{"id":"mood/epic","title":"Epic","category":"mood","medium":["image","video"],"models":["any"],"tags":["epic","grand","heroic","scale"],"negative":"","notes":"","source":"","body":"epic and grand in scale, sweeping space, heroic posture, dramatic sky"},{"id":"mood/hopeful","title":"Hopeful","category":"mood","medium":["image","video"],"models":["any"],"tags":["hopeful","uplifting","light"],"negative":"","notes":"","source":"","body":"hopeful, light breaking through, characters looking toward the horizon, gentle upward movement"},{"id":"mood/intimate","title":"Intimate","category":"mood","medium":["image","video"],"models":["any"],"tags":["intimate","close","quiet","romantic"],"negative":"","notes":"","source":"","body":"intimate and quiet, close distance between people, soft voices, small gestures"},{"id":"mood/joyful","title":"Joyful","category":"mood","medium":["image","video"],"models":["any"],"tags":["joyful","happy","bright","lively"],"negative":"","notes":"","source":"","body":"joyful and lively, bright color, open smiles, bouncy natural movement"},{"id":"mood/melancholic","title":"Melancholic","category":"mood","medium":["image","video"],"models":["any"],"tags":["melancholic","sad","quiet","slow"],"negative":"","notes":"","source":"","body":"melancholic, quiet and heavy, slow movement, lowered gaze, muted surroundings"},{"id":"mood/nostalgic","title":"Nostalgic","category":"mood","medium":["image","video"],"models":["any"],"tags":["nostalgic","memory","warm","soft"],"negative":"","notes":"","source":"","body":"nostalgic, warm memory-like glow, soft focus edges, familiar everyday details"},{"id":"mood/serene","title":"Serene","category":"mood","medium":["image","video"],"models":["any"],"tags":["serene","calm","peaceful"],"negative":"","notes":"","source":"","body":"serene and peaceful, slow gentle motion, soft light, nothing hurried"},{"id":"mood/tense","title":"Tense","category":"mood","medium":["image","video"],"models":["any"],"tags":["tense","suspense","thriller"],"negative":"","notes":"","source":"","body":"tense atmosphere, held breath, tight framing, stillness before something happens"},{"id":"negative/anatomy-artifacts","title":"Anatomy Artifacts","category":"negative","medium":["image","video"],"models":["midjourney","sdxl"],"tags":["anatomy","hands","artifact"],"negative":"","notes":"","source":"","body":"extra fingers, fused fingers, malformed hands, extra limbs, distorted face"},{"id":"negative/cartoonish-look","title":"Cartoonish Look","category":"negative","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["realism","cartoon","acting"],"negative":"","notes":"","source":"","body":"No cartoon look. No exaggerated acting. No plastic skin."},{"id":"negative/flicker-and-jitter","title":"Flicker and Jitter","category":"negative","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["video","flicker","stability"],"negative":"","notes":"","source":"","body":"No flicker. No camera jitter. No warping backgrounds."},{"id":"negative/low-quality","title":"Low Quality","category":"negative","medium":["image","video"],"models":["midjourney","sdxl"],"tags":["quality","blur","noise"],"negative":"","notes":"","source":"","body":"blurry, low resolution, jpeg artifacts, oversaturated, noisy"},{"id":"negative/no-background-crowd","title":"No Background Crowd","category":"negative","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["video","background","clean"],"negative":"","notes":"","source":"","body":"No random background people. No extra objects entering the frame."},{"id":"negative/text-and-watermarks","title":"Text and Watermarks","category":"negative","medium":["image","video"],"models":["midjourney","sdxl"],"tags":["text","watermark","logo"],"negative":"","notes":"","source":"","body":"text, captions, logos, watermarks, signatures"},{"id":"negative/uncanny-skin","title":"Uncanny Skin","category":"negative","medium":["image","video"],"models":["midjourney","sdxl"],"tags":["skin","uncanny","realism"],"negative":"","notes":"","source":"","body":"plastic skin, waxy face, overly smooth skin, dead eyes"},{"id":"negative/video-continuity","title":"Video Continuity","category":"negative","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["video","continuity","consistency"],"negative":"","notes":"","source":"","body":"No extra characters. No identity change. No sudden cuts. No morphing objects."},{"id":"shot-size/close-up","title":"Close-Up","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["close-up","cu","face","emotion"],"negative":"","notes":"","source":"","body":"close-up, the face fills the frame, eyes sharp"},{"id":"shot-size/cowboy-medium-long","title":"Cowboy Medium Long","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["cowboy","mls","medium-long","western"],"negative":"","notes":"","source":"","body":"medium long (cowboy) shot framed from mid-thigh up, hands visible near the waist"},{"id":"shot-size/extreme-close-up","title":"Extreme Close-Up","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["ecu","extreme-close-up","detail","macro"],"negative":"","notes":"","source":"","body":"extreme close-up on a single feature, such as an eye or a hand, filling the frame"},{"id":"shot-size/extreme-long-shot","title":"Extreme Long Shot","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["els","extreme-wide","establishing","landscape"],"negative":"","notes":"","source":"","body":"extreme long shot, tiny figure dwarfed by a vast landscape, location dominates the frame"},{"id":"shot-size/full-body-long-shot","title":"Full Body Long Shot","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["long-shot","full-body","ls"],"negative":"","notes":"","source":"","body":"long shot, full body visible head to toe with surrounding space"},{"id":"shot-size/insert-detail-shot","title":"Insert Detail Shot","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["insert","detail","object","clue"],"negative":"","notes":"","source":"","body":"insert shot of a single object in sharp focus, background reduced to soft shapes"},{"id":"shot-size/medium-close-up","title":"Medium Close-Up","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["mcu","medium-close-up","chest-up","reaction"],"negative":"","notes":"","source":"","body":"medium close-up framed from the chest up, face clearly readable"},{"id":"shot-size/medium-shot","title":"Medium Shot","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["medium","ms","waist-up","dialogue"],"negative":"","notes":"","source":"","body":"medium shot framed from the waist up"},{"id":"shot-size/two-shot","title":"Two-Shot","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["two-shot","relationship","dialogue"],"negative":"","notes":"","source":"","body":"two-shot, both characters framed together at the same depth, interaction clearly visible"},{"id":"shot-size/wide-establishing-shot","title":"Wide Establishing Shot","category":"shot-size","medium":["image","video"],"models":["any"],"tags":["wide","establishing","location","ws"],"negative":"","notes":"","source":"","body":"wide establishing shot, full environment visible with scale, time of day and weather readable"},{"id":"style/90s-cel-anime","title":"90s Cel Anime","category":"style","medium":["image","video"],"models":["any"],"tags":["anime","90s","cel","retro"],"negative":"","notes":"","source":"","body":"1990s cel-animated anime look, hand-drawn cels, slightly soft grainy transfer, flat bold color, hatching for shadow, retro sci-fi mood"},{"id":"style/analog-35mm-film","title":"Analog 35mm Film","category":"style","medium":["image","video"],"models":["any"],"tags":["analog","35mm","film","grain"],"negative":"","notes":"","source":"","body":"analog 35mm film photograph, visible grain, soft contrast, gentle color shifts, light leaks at the edges"},{"id":"style/arcane-painterly","title":"Arcane Painterly","category":"style","medium":["image","video"],"models":["any"],"tags":["arcane","painterly","stylized","3d","animation"],"negative":"","notes":"","source":"","body":"Arcane-inspired painterly 3D animation style, hand-painted brush-stroke textures over stylized 3D forms, exaggerated proportions, saturated magenta and teal rim lights, gritty ornate detail"},{"id":"style/art-deco","title":"Art Deco","category":"style","medium":["image","video"],"models":["any"],"tags":["art-deco","geometric","vintage","poster"],"negative":"","notes":"","source":"","body":"Art Deco design, strong symmetry, geometric sunburst motifs, gold and black with emerald accents, streamlined glamour"},{"id":"style/art-nouveau-poster","title":"Art Nouveau Poster","category":"style","medium":["image","video"],"models":["any"],"tags":["art-nouveau","poster","ornamental","vintage"],"negative":"","notes":"","source":"","body":"Art Nouveau poster illustration, flowing organic linework, ornamental floral borders, elegant elongated figures, muted gold and sage palette"},{"id":"style/bauhaus-poster","title":"Bauhaus Poster","category":"style","medium":["image","video"],"models":["any"],"tags":["bauhaus","geometric","poster","minimal"],"negative":"","notes":"","source":"","body":"Bauhaus-inspired poster, prima
