<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Library</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1db;--accent:#7a4dff;--accent-ink:#fff;--chip:#efece6;--warn:#b25b00}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141416;--panel:#1d1d21;--ink:#ececef;--mute:#9a9aa3;--line:#2d2d33;--accent:#9b7bff;--accent-ink:#141416;--chip:#2a2a30;--warn:#f0a050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
#q{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
#count{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:1100px){main{grid-template-columns:1fr}aside{position:static!important;max-height:none!important}}
aside{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 6px;font-weight:600}
h2:first-child{margin-top:0}
.facet{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:4px 8px;border-radius:6px;cursor:pointer;font:inherit}
.facet:hover{background:var(--chip)}.facet.on{background:var(--accent);color:var(--accent-ink)}
.facet span:last-child{opacity:.6;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mute);border:0;font-family:inherit}
button.chip{cursor:pointer}button.chip.on{background:var(--accent);color:var(--accent-ink)}
select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:600}
.body{white-space:pre-wrap;margin:6px 0;max-height:9.5em;overflow:hidden;position:relative;color:var(--ink)}
.body.open{max-height:none}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sp{flex:1}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{color:var(--mute);font-size:13px;margin:4px 0}
.neg{color:var(--warn);font-size:13px}
.picked{display:flex;justify-content:space-between;gap:6px;padding:3px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:120px}
.warn{color:var(--warn);font-size:12px;margin:4px 0}
.empty{color:var(--mute);text-align:center;padding:40px}
</style>
</head>
<body>
<header>
  <h1>Prompt Library</h1>
  <input id="q" type="search" placeholder="Search styles, cameras, lighting, methods…  (try: pixel, dolly, noir)" autofocus>
  <span id="count"></span>
</header>
<main>
  <aside class="panel" id="facets"></aside>
  <section id="results"></section>
  <aside class="panel" id="composer"></aside>
</main>

"any"],"tags":["snow","mountain","landscape","cold"],"negative":"","notes":"","source":"","body":"a narrow snowy mountain pass at dusk, wind-blown powder, jagged peaks, a faint line of footprints"},{"id":"environment/space-station-corridor","title":"Space Station Corridor","category":"environment","medium":["image","video"],"models":["any"],"tags":["sci-fi","space","corridor","interior"],"negative":"","notes":"","source":"","body":"a narrow space-station corridor with ribbed white panels, flickering strip lights, a porthole showing stars"},{"id":"environment/underwater-reef","title":"Underwater Reef","category":"environment","medium":["image","video"],"models":["any"],"tags":["underwater","reef","nature","blue"],"negative":"","notes":"","source":"","body":"a coral reef in clear shallow water, shafts of sunlight, schools of small fish, drifting particles"},{"id":"full-prompt/anime-rooftop-sunset","title":"Anime Rooftop Sunset","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["anime","rooftop","sunset","key-visual"],"negative":"","notes":"","source":"","body":"Modern anime key visual of a schoolgirl standing on a rooftop at sunset, wind lifting her hair and scarf, huge billowing clouds in orange and violet, clean line art, soft cel shading, lens glow, detailed painted city skyline"},{"id":"full-prompt/arcane-painterly-portrait","title":"Arcane Painterly Portrait","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["arcane","portrait","painterly","stylized"],"negative":"","notes":"","source":"","body":"Arcane-inspired painterly portrait of a determined young inventor with short blue hair and brass goggles pushed up on her forehead, hand-painted brush-stroke texture over stylized 3D forms, harsh magenta rim light on the left and teal fill on the right, grimy workshop smoke behind her, detailed ornate collar, gritty and rich"},{"id":"full-prompt/devgarh-aerial-establishing","title":"Devgarh Aerial Establishing","category":"full-prompt","medium":["image","video"],"models":["seedance-2"],"tags":["aerial","establishing","village","indian","dawn"],"negative":"","notes":"","source":"creator-handover-guide","body":"Wide aerial establishing view of a small North Indian town at dawn, brick and concrete rooftops, smoke from cooking fires rising, narrow lanes with tiny figures walking, warm amber haze over the distant fields. The camera drifts slowly forward at constant height. Soft golden backlight, realistic scale and atmosphere. No cuts, no text."},{"id":"full-prompt/fantasy-valley-landscape","title":"Fantasy Valley Landscape","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["fantasy","landscape","concept-art","epic"],"negative":"","notes":"","source":"","body":"Epic fantasy valley at dawn, a winding river reflecting a pink sky, floating islands with waterfalls in the distance, ancient stone bridge in the foreground, layered atmospheric haze, painterly concept art, sweeping composition"},{"id":"full-prompt/food-macro-steam","title":"Food Macro Steam","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["food","macro","ramen","steam"],"negative":"","notes":"","source":"","body":"Macro photograph of a bowl of ramen, glossy broth, steam curling up in backlight, soft-boiled egg halved with a jammy yolk, chopsticks lifting noodles, shallow depth of field, warm moody restaurant lighting"},{"id":"full-prompt/foot-stepping-out-of-vehicle","title":"Foot Stepping Out of Vehicle","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["insert","foot","vehicle","detail","transition"],"negative":"","notes":"","source":"creator-handover-guide","body":"Low insert shot of a brown leather boot stepping down from the open door of a white SUV onto a dusty concrete yard strewn with dry leaves. The boot plants firmly, dust puffs slightly, the heavy door visible above. Camera locked off at ground level. Natural afternoon sunlight, realistic weight and contact. No face shown."},{"id":"full-prompt/interrogation-room-wide","title":"Interrogation Room Wide","category":"full-prompt","medium":["image","video"],"models":["seedance-2"],"tags":["interrogation","room","tension","wide","indian"],"negative":"","notes":"","source":"creator-handover-guide","body":"Wide shot of a bare concrete room with a cracked wall. A man in a beige shirt sits tied to a chair in the center, rope across his chest, head slightly lowered, eyes wet. Two men stand at the edges of the frame with arms crossed, half in shadow. A single bare bulb overhead throws a narrow shaft of dusty amber light onto the man. Cinematic realism, heavy shadows, still camera."},{"id":"full-prompt/noir-detective-doorway","title":"Noir Detective Doorway","category":"full-prompt","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["noir","detective","black-and-white","smoke","dolly-in"],"negative":"","notes":"","source":"","body":"Medium shot of a detective in a trench coat and fedora standing in a doorway, venetian blind shadows striping his face and the wall behind him. He lifts a cigarette to his lips; smoke curls up through a hard shaft of light. Black and white, high contrast, film grain. The camera slowly dollies in on his eyes. He does not blink. Distant rain and a muffled saxophone."},{"id":"full-prompt/overhead-evidence-still-life","title":"Overhead Evidence Still Life","category":"full-prompt","medium":["image","video"],"models":["seedance-2"],"tags":["overhead","evidence","still-life","detail","clue"],"negative":"","notes":"","source":"creator-handover-guide","body":"Top-down view of a stained concrete floor: a scatter of coins in the center, four worn rubber slippers arranged around it, a steel pan at the top-left, and a bare bulb hanging at frame-right casting one hard yellow stripe of light across the floor. No people visible. The frame holds completely still for a visual pause. Realistic textures, high contrast."},{"id":"full-prompt/perfume-macro-hero","title":"Perfume Macro Hero","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["product","perfume","macro","luxury"],"negative":"","notes":"","source":"","body":"Hero product photograph of a faceted glass perfume bottle with a gold cap on a wet black reflective surface, droplets on the glass, thin rim light tracing the edges, soft gradient backdrop in deep emerald, macro lens, shallow depth of field, luxury advertising look"},{"id":"full-prompt/photoreal-window-light-portrait","title":"Photoreal Window-Light Portrait","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["photorealistic","portrait","elderly","window-light"],"negative":"","notes":"","source":"","body":"Photorealistic portrait of an elderly fisherman, 85mm lens at f/1.8, soft window light from the left, deep wrinkles, salt-and-pepper stubble, natural skin pores, wet-wool collar, creamy blurred background of a dim boathouse, subtle film grain, muted teal and amber tones"},{"id":"full-prompt/pixel-art-cyberpunk-city","title":"Pixel Art Cyberpunk City","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["pixel","cyberpunk","city","night","game"],"negative":"","notes":"","source":"","body":"16-bit pixel art cyberpunk city street at night, rain-slick pavement, glowing neon shop signs in pink and teal, a lone hooded figure with an umbrella, parallax layers of towers fading into purple haze, 64-color palette, crisp pixel edges, dithered shading"},{"id":"full-prompt/police-suv-on-farm-road","title":"Police SUV on Farm Road","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["vehicle","aerial","road","indian","rural","transition"],"negative":"","notes":"","source":"creator-handover-guide","body":"High aerial view of a white SUV with a red beacon driving along a narrow asphalt road through green farmland, a large banyan tree on the left casting a long shadow across the road. The camera follows from behind and above at a steady distance as the vehicle travels away from the camera. Early morning sunlight, rich greens, realistic vehicle motion, light dust trailing. No cuts."},{"id":"full-prompt/raghav-whiskey-sequence-15s","title":"Raghav Whiskey Sequence 15s","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["seedance","whiskey","three-shot","dialogue","macro","hindi"],"negative":"","notes":"Product/detail → character reveal → information/reaction. Tells the model event order, camera move, what is sharp vs blurred, the dialogue and the exact reaction.","source":"creator-handover-guide","body":"15-second continuous sequence with three connected shots.\n\nSHOT 1 — 0-5 seconds\n\nExtreme macro close-up of a crystal whiskey tumbler on a polished walnut desk. Two clear ice cubes fall into the empty glass in slow motion. A rich amber stream of whiskey pours over the ice, creating small ripples and bubbles. The camera slowly moves in a circular orbit around the glass. Warm amber light reflects naturally through the crystal. Premium, realistic materials and reflections.\n\nSHOT 2 — 5-10 seconds\n\nThe camera smoothly moves upward with the whiskey glass as Raghav's hand lifts it from the desk. Keep the glass sharp in the foreground. Raghav's face stays softly out of focus in the background. As the glass reaches his lips, gradually shift focus to Raghav's side profile. He takes one slow sip. The glass partially covers his face.\n\nSHOT 3 — 10-15 seconds\n\nThe whiskey glass slowly lowers into the foreground. Keep Raghav's side profile sharp and the background heavily blurred. A person remains out of focus in the background and says:\n\n\"Sir..... ...naya IPS officer aa chuka hai.\"\n\nRaghav does not turn. He pauses for a moment. Then the corner of his lips slowly rises into a confident smile. Hold on his smile.\n\nKeep the same character, location, lighting and glass throughout the sequence. Realistic human movement, realistic liquid and glass physics, natural focus changes. No extra characters visible in focus. No exaggerated acting. No cartoon look."},{"id":"full-prompt/rainy-neon-street-walk","title":"Rainy Neon Street Walk","category":"full-prompt","medium":["video"],"models":["seedance-2","higgsfield"],"tags":["cyberpunk","neon","rain","tracking","night"],"negative":"","notes":"","source":"","body":"A courier in a reflective jacket walks toward the camera down a rain-soaked neon alley at night, puddles mirroring magenta and cyan signs, steam rising from grates. The camera tracks backward at the same pace, handheld with subtle sway. Shallow depth of field, anamorphic flares. Rain, distant traffic, soft synth hum."},{"id":"full-prompt/solarpunk-city-daylight","title":"Solarpunk City Daylight","category":"full-prompt","medium":["image"],"models":["midjourney","flux","sdxl"],"tags":["solarpunk","city","architecture","optimistic"],"negative":"","notes":"","source":"","body":"Solarpunk city at midday, white towers draped in hanging gardens, solar glass canopies, people on elevated walkways, clean airy daylight, lush greens against pale stone, wide architectural view"},{"id":"full-prompt/tea-stall-boy-close-up","title":"Tea Stall Boy Close-Up","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["close-up","child","tea-stall","indian","emotional"],"negative":"","notes":"","source":"creator-handover-guide","body":"Close-up of a seven-year-old village boy sitting on a wooden bench at a tea stall, steam rising from a steel cup entering the frame from the left. He stays still, eyes wide, lips slightly parted, watching someone off-screen. Shallow depth of field, warm dusty daylight from behind him, soft background of steel pots and a wooden counter. Natural skin texture. Subtle handheld breathing. No exaggerated acting."},{"id":"full-prompt/vachan-character-sheet-01-yashoda","title":"Vachan Character Sheet 01 — Yashoda","category":"full-prompt","medium":["image"],"models":["any"],"tags":["krishna-vachan","character-sheet","part-2","four-view","mythological","indian","new-character"],"negative":"","notes":"Save as Yashoda.png. Standalone prompt (no attachment). Draft production design, not a casting lock.","source":"PART2_CHARACTER_SHEET_PROMPTS.md","body":"Create a cinematic character reference sheet for YASHODA, for an Indian mythological film about Krishna’s birth.\n\nLayout: four clearly separated photographic views on one landscape image—full-body front, full-body rear, waist-up three-quarter view, and a detailed face close-up. Exactly the same person, facial features, age, body proportions, clothing, jewelry and hairstyle in every panel. Plain neutral earth-colored background, clear readable illumination. The canvas contains photographic views only.\n\nYashoda is an Indian woman approximately 30–35 years old, with warm medium-brown skin, a softly rounded face, expressive dark-brown eyes, full cheeks and a welcoming maternal smile. Her build is sturdy and naturally full, with relaxed shoulders and practical movement.\n\nDress her in a warm turmeric-ochre cotton sari with a restrained deep-red woven border and a matching deep-red short-sleeved blouse. The sari pallu sits securely over her LEFT shoulder, leaving both hands free for churning butter. Center-parted black hair forms a compact low bun. Small red bindi, small gold earrings, a short simple gold necklace, coordinated red-and-gold bangles and traditional flat sandals. Her household clothing has fine woven texture and comfortable folds. Keep her arms relaxed and hands empty.\n\nPhotorealistic Indian epic cinema. Earthy visual treatment with natural skin tones, tactile cloth, restrained warm gold, rich natural colors and substantial but readable shadows. Soft directional studio illumination reveals facial identity and fabric construction. Full-body views include the complete head and feet. Orig e a consistent simple instrument design. His RIGHT forearm is free. The reference establishes instrument and carrying arrangement; putting it aside before the tray demonstration belongs in the video blocking.\n\nPhotorealistic Indian epic cinema. Earthy visual treatment with natural skin tones, tactile cloth, restrained warm gold, rich natural colors and substantial but readable shadows. Soft directional studio illumination reveals facial identity and fabric construction. Full-body views include the complete head and feet. Original individual face and believable human proportions."},{"id":"full-prompt/vachan-clip-01-gokul-awakens-a-request-for-butter","title":"Vachan Clip 01 — Gokul awakens; a request for butter","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","clip-01","part-2","mythological","indian","hindi","multi-shot","timed-shots"],"negative":"","notes":"30 seconds | Part 2 00:00–00:30 · Current 21-clip edition","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"PART 2 — CLIP 01: Gokul awakens; a request for butter\nDuration: 30 seconds | Part 2 00:00–00:30\n\nCreate a photorealistic live-action Indian mythological film sequence, landscape 16:9, real-time human motion except explicit editorial ellipses. Tactile cloth, worn stone/wood, natural skin, subtle film grain, rich restrained colors and readable shadows. Grandness comes from layered depth, human scale, motivated reveals and emotional consequence. Use barely perceptible handheld breathing on human medium/close coverage, smooth movement for wide architectural reveals, steady framing for exact hand/prop contact. Lens values are proposed full-frame-equivalent choices.\n\nREFERENCE USE:\nReference images establish identity, costume or physical design only. Do NOT use any location sheet or character-sheet collage as the starting frame. Begin with the newly staged live shot specified below. Never render reference labels, panels or watermarks. Keep every principal distinct; extras have independent varied faces, ages and garments rather than duplicates of the leads. Preserve real background population through angle changes.\n\nDIALOGUE AND SOUND RULES:\nOnly the assigned speaker says the quoted Roman-Hindi line. Natural Hindi pronunciation, complete words, conversational rhythm and emotion; acting instructions are silent directions. Listeners react with eyes, breath and posture and do not mouth another person's line. Dialogue windows include pauses; finish words before the next speaker begins. No BGM, narrator, subtitles or on-screen text. Only location sound, nonverbal reactions and explicitly established diegetic instruments. Maintain environmental motion even during an emotional pause: breathing, small cloth movement, live flames and drifting smoke where present. No frozen background or slow-motion lip sync.\n\nPERFORMANCE DIRECTION — SILENT ENGLISH INSTRUCTIONS:\nThe English meaning below each spoken line explains the intent; only the quoted Hindi dialogue is audible. Play a thought changing in response to the previous event: notice, react, then speak. The line-specific acting direction sets facial expression, eyeline, vocal delivery and the listener's response. Use one meaningful bodily action at a time within the existing positions; keep occupied hands and infant support fixed. Scale performance to the scene: playful comedy, vulnerable longing, desperate grief, public intimidation and tender celebration have different energies. Keep emotion alive after the last word and carry it into the next shot rather than resetting to a neutral portrait. Use the existing shot time for reaction and breath; these cues add no seconds or new cuts. Phonetic spelling helps pronunciation only; connected Hindi rhythm and emotional phrasing take priority over syllable-by-syllable reading.\n\nPRONUNCIATION USE:\nSpeak each DIALOGUE line once, using its Pronunciation guide only as a silent pronunciation aid. Never speak the words \"Pronunciation guide\" or repeat the guide as a second line. Hyphens separate syllables for guidance; deliver connected, natural Hindi rather than pausing at each hyphen. Capitals highlight articulation and long vowels, not shouting or artificial English stress. Preserve the specified emotion, speaker and existing time window. Keep bh, dh, th, chh and gh as Hindi aspirated consonants; th is not the English sound in \"think\". Preserve nasal vowels in main, mein, hain and hoon. Bhay means fear and is not bhaai (brother).\n\nATTACH IN THIS ORDER:\n[Image 1] = establishing GOKUL VILLAGE.png\nGokul scale/palette reference: broad hillside view, numerous thatched houses, flowers, trees and river along far LEFT. Populate live action and preserve river side. Do not identify its generic foreground compound as an exact matching view of [Image 6].\n\n[Image 2] = Gokul village.png\nGokul lane: earthy thatched houses, well, open curved earthen path, trees and flowers. Use for lane-level scenes within the settlement.\n\n[Image 3] = yashoda.jpg\nYashoda: preserve approved youthful face, mustard-gold sari, maroon blouse, gold ornaments and maang tikka. Use the PORTRAIT head-covered pallu arrangement consistently, including wide shots; braid remains as pictured. Voice continuity: Warm, youthful adult Hindi voice with affectionate wit; soften and slow on longing.\n\n[Image 4] = bal sakha 1.png\nBal-sakha 1: younger curly-haired boy, ivory sleeveless vest and mustard lower cloth. Preserve identity and age; barefoot in courtyard. Voice continuity: Higher, young child Hindi voice, eager and short-breathed with excitement.\n\n[Image 5] = bal sakha 2.jpeg\nBal-sakha 2: older shoulder-length-haired child, brick-red tunic and blue dhoti, barefoot. Distinct from the younger child. Voice continuity: Older child Hindi voice, playful earnest reasoning, distinct from younger boy.\n\n[Image 6] = yashoda house.jpg\nNanda–Yashoda shared courtyard: architectural master. Ochre walls, thatched veranda, dark timber pillars, tree and rectangular village gateway on RIGHT. Preserve all doors, tree, steps and pillars across coverage.\n\nOPENING AND PHYSICAL POSITIONS:\nNew morning in Gokul after Part 1's prison ending. This is a location/time change, not the same night continuing.\n\nFIXED LOCATION GEOGRAPHY:\nApply each location only in its specified shots. Timed actions determine changing posture, custody, cuffs and gate state. A change of camera angle never moves an actor.\nCOURTYARD GEOGRAPHY: Use the house image as master from the near shaded veranda looking inward: flowered near pillar LEFT, far residential veranda across frame, mature tree and village gateway RIGHT. Morning churning station sits on the far veranda LEFT of centre, on a mat with clay pot and wooden rope churn. Yashoda sits behind it facing the open courtyard. Children occupy its courtyard side, younger child to her anatomical right, older to her left. A low rectangular wooden cradle with four short legs, flat ivory mattress and folded cream cloth stands one metre behind and to Yashoda's left under the veranda; it is her personal empty cradle. Main entry is the RIGHT gateway by the tree. Walking routes use the open courtyard and existing veranda step. Do not invent a forest exit. Warm morning sun from courtyard RIGHT, soft veranda shade, olive greens, mustard/ochre warmth. Leaves, flower clusters and fabric move gently; birds, cowbells and rope/churn creaks are natural ambience.\n\nCAMERA AND ACTION CONTINUITY:\nBefore each cut, preserve the stated seats, standing places, facing directions, occupied hands and object ownership. A closer view crops the existing arrangement. For dialogue, place the listener on the speaker’s established eyeline; keep a recognizable listener shoulder or background landmark where framing permits. Movement finishes in the stated destination before the next action begins. Timed windows include physical movement and reactions.\n\nLIVE BACKGROUND PERFORMANCE — INCLUDING DEFOCUSED PEOPLE:\nEvery visible background person is a live performer, not a still image or frozen plate. Start each shot with activity already in progress. Soft focus changes detail, never motion. Breathing and blinks continue, but are insufficient alone in blur: stagger small, readable silhouette changes such as a slight head turn, shoulder settling, a hand sliding from knee to chair arm, or a restrained lean and return. In a 6–10 second populated shot, let one or two visible extras complete different small actions at separate moments while the others breathe naturally. For shorter cuts carry an action across the cut instead of restarting everyone. Keep activity quieter than the speaker; no constant swaying, synchronized nodding, repeated loops, exaggerated gestures or newly invented speech. Maintain each person's seat, identity, clothing, eyeline and occupied hands across angles. An emotional silence means restrained living attention, never absolute bodily immobility. Do not add people to empty or private scenes. No frozen bokeh crowd, animated camera over a still background, moving cutout silhouettes or motion limited to flames and smoke.\n\nTIMED SHOTS:\n\n00–07s — Shot 1: World reveal\n24mm elevated oblique glide from low foreground flowers into the broad hillside view. Begin with leaves already stirring and tiny villagers already walking; reveal dozens of roofs, river on far LEFT, grazing cows and calves. Keep the warm gold/green tone of [Image 1]. Women carry clay pots toward the river path, herders guide cattle at walking pace; no synchronized crowd motion. Water ripples and a small boat moves slowly under a visible boatman's pole. Smooth restrained parallax, not a static sheet zoom.\n\n07–12s — Shot 2: Work at the well\n35mm ground-level lateral move in [Image 2]: an independently cast older woman pulls a rope, another receives a water pot at the well. Frame foreground trough, middle workers and receding homes. Cows move behind at a safe distance, tails swish. Preserve rustic thatch/ochre and flowers. Sound: bucket splash, rope, birds, soft cowbells.\n\n12–16s — Shot 3: Small life\n65mm calf muzzle nuzzles an anonymous herder's palm at lane edge; tilt enough to reveal the human hand/forearm and moving animal. Finish with calf withdrawing gently. No speech. A domestic churning creak begins faintly as an editorial sound bridge.\n\n16–21s — Shot 4: Find the household\nSCENE STATE AT THIS CUT: Morning. Yashoda and both children are already at the churning station. Nanda is not yet in the courtyard.\n28mm newly staged courtyard wide, slow lateral reveal past flowered LEFT pillar. Show RIGHT gateway, tree, seated Yashoda and children at far veranda, personal empty cradle behind her left. Pan settles on active rope churning; supporting village activity glimpsed only beyond gateway.\n\n21–25s — Shot 5: The request\n50mm low child-height two-shot of younger boy and Yashoda. 21–23s Bal-sakha 1, eagerly watching pot: \"Maiya, makhan!\"\nPronunciation guide: MAI-yaa, MAA-khan!\nEnglish meaning (not spoken): I want butter, mother.\nActing and response (not spoken): The younger boy wants her attention: eyes dart from butter pot to her face, eyebrows lift and torso inclines eagerly. Say Maiya as a call, makhan as an impatient request. Yashoda notices his expectation before her amused glance.\n\nYashoda gives him an amused sideways glance while finishing a churn pull.\n\n25–30s — Shot 6: Patient mother\n65mm Yashoda medium close-up, small handheld breath. 25–30s Yashoda, warmly teasing: \"Abhi toh bana bhi nahi hai! Thoda dheeraj rakho.\"\nPronunciation guide: a-BHEE to ba-NAA bhee na-HEE hai! THO-daa DHEE-raj ra-kho.\nEnglish meaning (not spoken): It is not ready yet; be patient.\nActing and response (not spoken): Yashoda enjoys his impatience. Start with raised brows and a playful smile on Abhi; soften the eyes on dheeraj, ending in a gently descending reassuring voice. Keep the established churn hand movement; the boy watches her hands expectantly.\n\nShe eases rope tension without letting the spindle vanish.\n\nFINAL STATE:\nAt the far-veranda churning station, Yashoda and both boys remain seated in their assigned places. She has just asked for patience and eases rope tension; the churn settles. Nanda remains outside the RIGHT gateway. Nobody has taken butter."},{"id":"full-prompt/vachan-clip-02-the-children-negotiate-nanda-arrives","title":"Vachan Clip 02 — The children negotiate; Nanda arrives","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","clip-02","part-2","mythological","indian","hindi","multi-shot","timed-shots"],"negative":"","notes":"30 seconds | Part 2 00:30–01:00 · Current 21-clip edition","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"PART 2 — CLIP 02: The children negotiate; Nanda arrives\nDuration: 30 seconds | Part 2 00:30–01:00\n\nCreate a photorealistic live-action Indian mythological film sequence, landscape 16:9, real-time human motion except explicit editorial ellipses. Tactile cloth, worn stone/wood, natural skin, subtle film grain, rich restrained colors and readable shadows. Grandness comes from layered depth, human scale, motivated reveals and emotional consequence. Use barely perceptible handheld breathing on human medium/close coverage, smooth movement for wide architectural reveals, steady framing for exact hand/prop contact. Lens values are proposed full-frame-equivalent choices.\n\nREFERENCE USE:\nReference images establish identity, costume or physical design only. Do NOT use any location sheet or character-sheet collage as the starting frame. Begin with the newly staged live shot specified below. Never render reference labels, panels or watermarks. Keep every principal distinct; extras have independent varied faces, ages and garments rather than duplicates of the leads. Preserve real background population through angle changes.\n\nDIALOGUE AND SOUND RULES:\nOnly the assigned speaker says the quoted Roman-Hindi line. Natural Hindi pronunc  a hand sliding from knee to chair arm, or a restrained lean and return. In a 6–10 second populated shot, let one or two visible extras complete different small actions at separate moments while the others breathe naturally. For shorter cuts carry an action across the cut instead of restarting everyone. Keep activity quieter than the speaker; no constant swaying, synchronized nodding, repeated loops, exaggerated gestures or newly invented speech. Maintain each person's seat, identity, clothing, eyeline and occupied hands across angles. An emotional silence means restrained living attention, never absolute bodily immobility. Do not add people to empty or private scenes. No frozen bokeh crowd, animated camera over a still background, moving cutout silhouettes or motion limited to flames and smoke.\n\nTIMED SHOTS:\n\n00–07s — Shot 1: The negotiator\n50mm older child with younger in same plane. 00–07s Bal-sakha 2, mock-serious reasoning addressed to Yashoda: \"Dheeraj toh bade log rakhte hain, Maiya. Hum toh bachche hain!\"\nPronunciation guide: DHEE-raj to ba-DE log RAKH-te hain, MAI-yaa. hum to BACH-che hain!\nEnglish meaning (not spoken): Patience is for grown-ups; we are children.\nActing and response (not spoken): The older child argues a mock-serious case: chin rises slightly on bade log, then the serious face opens into a cheeky grin on bachche. Use quick, bright conversational phrasing. Yashoda tries to keep a stern face; the younger boy looks to the older child for support.\n\nYounger child watches older one, suppressing a grin.\n\n07–10s — Shot 2: The accomplice\n65mm younger child leans forward, hands on his knees. 07–09s Bal-sakha 1: \"Aur bhookhe bhi!\"\nPronunciation guide: aur BHOO-khe bhee!\nEnglish meaning (not spoken): And hungry too!\nActing and response (not spoken): The younger boy adds his decisive argument: lean forward within his place, eyes widen, a delighted grin escapes after bhookhe. Give the short line a lively upward emphasis. Yashoda reacts to his cheekiness rather than to the camera.\n\nEnd on Yashoda's fond reaction at frame edge, churn stationary by her deliberate hand.\n\n10–15s — Shot 3: Mock outrage\nSCENE STATE AT THIS CUT: Yashoda seated behind clay churn; younger and older children in their assigned places. Nanda begins just outside RIGHT gateway with wooden staff; cattle are in lane.\n65mm Yashoda looks between children, incredulous amusement. 10–15s Yashoda: \"Bhookhe? Subah se teen baar kha chuke ho!\"\nPronunciation guide: BHOO-khe? SU-bah se teen baar khaa CHU-ke ho!\nEnglish meaning (not spoken): Hungry? You have eaten three times this morning!\nActing and response (not spoken): Yashoda feigns disbelief: eyebrows rise on Bhookhe, eyes move between the two children, then a smile breaks through on teen baar. Her voice carries affectionate mock scolding; keep body grounded at the churn. Children exchange a caught-out glance.\n\n\n15–20s — Shot 4: A technicality\n65mm older child keeps earnest eye contact. 15–20s Bal-sakha 2: \"Woh gina nahi jaata, Maiya. Woh toh jalpan tha.\"\nPronunciation guide: wo gi-NAA na-HEE JAA-taa, MAI-yaa. wo to JAL-paan thaa.\nEnglish meaning (not spoken): That does not count; it was only breakfast.\nActing and response (not spoken): The older child maintains an earnest straight face while negotiating: tiny head shake on gina nahi, lifted chin on jalpan, then a suppressed smile. Deliver with confident child logic. Preserve the younger child’s existing reach and Yashoda’s gentle hand tap.\n\nYounger child's fingertips creep toward pot; Yashoda gently taps the back of his hand and he withdraws, giggling.\n\n20–30s — Shot 5: A fatherly joke\n35mm angle includes gateway at RIGHT and churning group LEFT. Nanda enters from RIGHT, staff in RIGHT hand lowered vertically. A distinct herder keeps cattle outside. Nanda notices the conspiracy, smiles, approaches veranda along open ground. 21–30s Nanda: \"Yashoda, doodh kam ho raha hai, ya inke pet bade ho rahe hain?\"\nPronunciation guide: ya-SHO-daa, doodh kam ho ra-HAA hai, yaa IN-ke pet ba-DE ho ra-HE hain?\nEnglish meaning (not spoken): Is our milk decreasing, or are their appetites growing?\nActing and response (not spoken): Nanda sees the family joke before speaking: eyes move from children to Yashoda, cheeks lift, then eyebrow arches at the final question. Use warm teasing rhythm, a short natural turn between the two alternatives. Preserve his entrance and occupied staff hand; the children turn only after hearing him.\n\nChildren look to his face only after hearing him.\n\nFINAL STATE:\nNanda has approached the veranda from the RIGHT gateway and finished his affectionate joke. He stands near Yashoda with staff in RIGHT hand; she and the boys remain seated. Cattle stay outside with a herder. Churn stationary; personal cradle empty."},{"id":"full-prompt/vachan-clip-03-an-empty-cradle-a-distant-prison","title":"Vachan Clip 03 — An empty cradle; a distant prison","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","clip-03","part-2","mythological","indian","hindi","multi-shot","timed-shots"],"negative":"","notes":"30 seconds | Landscape 16:9 · Current 21-clip edition","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"PART 2 — CLIP 03: An empty cradle; a distant prison\nDuration: 30 seconds | Landscape 16:9\n\nCreate a photorealistic live-action Indian mythological film scene. Preserve the warm earthy color, natural skin, mustard-gold fabric, maroon blouse, timber and ochre plaster of the supplied Clip 2. Use gentle handheld breathing in human coverage and steady framing for the cradle insert. Faces, eyes, jewelry and fabric weave remain clearly resolved. Use medium shots and close-ups with moderate depth of field: the speaking face and relevant nearby objects stay sharp. Frame small, readable portions of the existing location.\n\nREFERENCE USE:\nUse character images for exact identity and costume, location images for architecture and materials, and the video for established blocking, prop appearance and performance continuity. Begin with a newly staged close view of the continuing action. Location sheets are design references, never starting frames. Reference labels and sheet layouts remain outside the film image.\n\nPERFORMANCE DIRECTION — SILENT ENGLISH INSTRUCTIONS:\nThe English meaning below each spoken line explains the intent; only the quoted Hindi dialogue is audible. Play a thought changing in response to the previous event: notice, react, then speak. The line-specific acting direction sets facial expression, eyeline, vocal delivery and the listener's response. Use one meaningful bodily action at a time within the existing positions; keep occupied hands and infant support fixed. Scale performance to the scene: playful comedy, vulnerable longing, desperate grief, public intimidation and tender celebration have different energies. Keep emotion alive after the last word and carry it into the next shot rather than resetting to a neutral portrait. Use the existing shot time for reaction and breath; these cues add no seconds or new cuts. Phonetic spelling helps pronunciation only; connected Hindi rhythm and emotional phrasing take priority over syllable-by-syllable reading.\n\nPRONUNCIATION USE:\nSpeak each DIALOGUE line once, using its Pronunciation guide only as a silent pronunciation aid. Never speak the words \"Pronunciation guide\" or repeat the guide as a second line. Hyphens separate syllables for guidance; deliver connected, natural Hindi rather than pausing at each hyphen. Capitals highlight articulation and long vowels, not shouting or artificial English stress. Preserve the specified emotion, speaker and existing time window. Keep bh, dh, th, chh and gh as Hindi aspirated consonants; th is not the English sound in \"think\". Preserve nasal vowels in main, mein, hain and hoon. Bhay means fear and is not bhaai (brother).\n\nATTACH IN THIS ORDER:\n[Image 1] = yashoda.jpg\nExact Yashoda identity, mustard-gold sari, maroon blouse, gold jewelry and maang tikka. Pallu covers her head as in Clip 2. Preserve her braid and natural complexion.\n\n[Image 2] = nanda.png\nExact Nanda identity, ochre turban, ivory kurta and dhoti, rust-orange dupatta, moustache and ornaments. Preserve his wooden staff and standing posture from Clip 2.\n\n[Image 3] = bal sakha 1.png\nYounger curly-haired boy, ivory sleeveless vest and mustard lower cloth, barefoot. He starts standing beside the pot, on Yashoda's screen-left in the established courtyard-facing view.\n\n[Image 4] = bal sakha 2.jpeg\nOlder child whom the user identifies as the girl: preserve this exact face, shoulder-length hair, brick-red tunic and blue lower garment. She starts standing farther away to Yashoda's screen-right, by the dark doorway near the right veranda pillar, as in Clip 2. Her clothes and hairstyle remain unchanged.\n\n[Image 5] = yashoda house.jpg\nCourtyard material and architectural reference. The rendered Clip 2 determines the established local placement of people, pot, pillars, doorway and woven furniture. Keep the village gateway to the right.\n\n[Image 6] = mathura prison exterior.png\nOnly for the final Mathura transition. Preserve its massive stone entrance, blue ambient light and localized torchlight in a closer exterior composition.\n\n[Video 1] = 2.mp4\nContinuity reference. Use its ending to preserve actual positions and its clearer close-ups for faces, fabric, pot and light. Reconstruct sharp medium/close coverage rather than enlarging its soft wide frame.\n\nOPENING AND PHYSICAL POSITIONS:\nContinue immediately after Nanda's affectionate joke from the right side of the courtyard. Yashoda remains seated at the large clay churning pot, with the existing upright rope-and-wood apparatus in front of her. The younger boy stands beside the pot to screen-left. The older girl is several steps farther right beside the doorway; she is not seated beside Yashoda. Nanda stands on the courtyard ground near the right veranda end, facing left toward Yashoda, holding his staff upright. Preserve these distances when changing camera angle.\n\nNanda remains standing throughout this courtyard sequence. Yashoda remains seated. Frame his replies looking down-left toward her and her replies looking up-right toward him. Keep cameras on the established courtyard-facing side of their eyeline. The children leave toward the right gateway along the veranda front and its existing step, staying clear of the pot, ropes and Nanda.\n\nThe woven seat already visible behind Yashoda stays unchanged. Her separate small empty wooden cradle is in the shaded veranda bay to her left, outside the previous wide frame. Reveal only a close detail of its empty bedding; keep this separate from the visible woven seat and from the churning apparatus.\n\nDIALOGUE AND SOUND RULES:\nOnly the named speaker mouths the quoted line. Maintain the adult voices established in Clip 2. Finish each line naturally within its shot. Listeners respond through eyes, breathing and small expressions. Quiet village ambience, retreating child footsteps, birds, distant cowbells and fabric sounds; the final prison shot uses water drops and torch crackle. Emotional pauses retain live breathing, drifting cloth and moving leaves. Dialogue remains clear. No background score, narrator, subtitles or displayed text.\n\nCAMERA AND ACTION CONTINUITY:\nBefore each cut, preserve the stated seats, standing places, facing directions, occupied hands and object ownership. A closer view crops the existing arrangement. For dialogue, place the listener on the speaker’s established eyeline; keep a recognizable listener shoulder or background landmark where framing permits. Movement finishes in the stated destination before the next action begins. Timed windows include physical movement and reactions.\n\nLIVE BACKGROUND PERFORMANCE — INCLUDING DEFOCUSED PEOPLE:\nEvery visible background person is a live performer, not a still image or frozen plate. Start each shot with activity already in progress. Soft focus changes detail, never motion. Breathing and blinks continue, but are insufficient alone in blur: stagger small, readable silhouette changes such as a slight head turn, shoulder settling, a hand sliding from knee to chair arm, or a restrained lean and return. In a 6–10 second populated shot, let one or two visible extras complete different small actions at separate moments while the others breathe naturally. For shorter cuts carry an action across the cut instead of restarting everyone. Keep activity quieter than the speaker; no constant swaying, synchronized nodding, repeated loops, exaggerated gestures or newly invented speech. Maintain each person's seat, identity, clothing, eyeline and occupied hands across angles. An emotional silence means restrained living attention, never absolute bodily immobility. Do not add people to empty or private scenes. No frozen bokeh crowd, animated camera over a still background, moving cutout silhouettes or motion limited to flames and smoke.\n\nTIMED SHOTS:\n\n00–03s — Shot 1: Her affectionate answer\n65mm seated-eye-level medium close-up of Yashoda at the same pot. She looks up-right toward standing Nanda, gives a small amused smile and says at 00–01s: \"Dono!\"\nPronunciation guide: DO-no!\nEnglish meaning (not spoken): Both!\nActing and response (not spoken): Yashoda looks up toward Nanda and gives the answer with quick comic certainty, one eyebrow lifting and a brief open smile. Let the smile linger as the children react; keep her seated and hands consistent with the pot.\n\nThe younger boy is only partly visible at the left edge, still standing. Yashoda finishes her current hand movement and rests the churning apparatus. Hold her fond reaction for the remainder; the rope and pot remain in place.\n\n03–07s — Shot 2: The children leave from their actual places\n50mm child-height medium framing follows the younger boy as he turns away from the pot and trots right along the clear veranda front. The older girl is already farther ahead near the right doorway; she turns from there and leads toward the gateway. Reveal her only when the follow movement reaches her existing position. They step down at the existing veranda end and continue right out of this tighter frame. Nanda stays on the courtyard side of their route, staff upright, allowing them to pass. Light footsteps and a small shared giggle carry into the next shot. Keep their movement continuous and their starting positions separate.\n\n07–15s — Shot 3: A smile becomes longing\n65mm Yashoda close-up from the same side. Her eyes briefly follow the departing children to the right, then lower toward the empty cradle offscreen to her left. Her smile softens into private longing, with a small breath before speaking.\nAt 08–15s Yashoda: \"Gokul mein kami kis cheez ki hai? Bas apne ghar ki kilkaari sunna baaki hai.\"\nPronunciation guide: GO-kul mein ka-MEE kis cheez kee hai? bas AP-ne ghar kee kil-KAA-ree SUN-naa BAA-kee hai.\nEnglish meaning (not spoken): Gokul lacks nothing; only our own child’s laughter is missing.\nActing and response (not spoken): Her eyes follow the children before moving toward the empty cradle. The smile fades on Bas apne ghar, lips press briefly between clauses, and shoulders release on kilkaari. Voice changes from conversational warmth to an intimate, slightly breathy admission. Nanda’s smile fades as he understands her longing.\n\nKeep the feeling restrained and intimate: moist eyes, a slight tightening of the lips, a steady effort to smile. She remains seated; Nanda listens from his established standing position offscreen right.\n\n15–20s — Shot 4: Nanda reassures her\n65mm medium close-up of standing Nanda at the same courtyard position. Frame turban to lower chest, a portion of the staff visible at one side. His eyes look down-left toward seated Yashoda. His teasing expression becomes sincere warmth.\nAt 15–20s Nanda: \"Bharega. Jis din bharega, poora Gokul jhoom uthega.\"\nPronunciation guide: bha-RE-gaa. jis din bha-RE-gaa, POO-raa GO-kul jhoom u-THE-gaa.\nEnglish meaning (not spoken): Our home will be filled; all Gokul will celebrate that day.\nActing and response (not spoken): Nanda wants to restore her hope. Begin after seeing her hurt; soften his brow and sustain eye contact down toward her. Grow warmer and fuller on poora Gokul, ending with one small assured nod. He stays standing with staff steady; Yashoda looks up, wanting to believe him.\n\nHe speaks gently across their existing distance, with a small reassuring nod. His body and staff remain grounded in place.\n\n20–23s — Shot 5: A familiar promise\n75mm close-up of seated Yashoda looking up-right toward him. With affectionate tiredness and a faint smile, she says:\n\"Aap har varsh yahi kehte hain.\"\nPronunciation guide: aap har varsh ya-HEE KEH-te hain.\nEnglish meaning (not spoken): You say this every year.\nActing and response (not spoken): Yashoda loves him but is tired of waiting: a faint uneven smile, moist eyes and a slight head tilt carry both feelings. Stress har varsh gently, not accusingly; the last words trail into a searching look. Nanda listens without interrupting.\n\nHer pallu edge stirs slightly. Hold her searching eyes at the end of the line.\n\n23–26s — Shot 6: The empty cradle\n85mm steady close detail of a folded cream baby cloth on the flat ivory bedding inside the separate empty wooden cradle. Only a small rail section and bedding fill the frame. Warm side light reveals cloth fibers; a corner lifts slightly in the breeze. This insert does not relocate Yashoda, Nanda or the existing woven seat.\nNanda speaks offscreen from his unchanged courtyard position, warmly certain:\n\"Ek din sach bhi hoga.\"\nPronunciation guide: ek din sach bhee HO-gaa.\nEnglish meaning (not spoken): One day it will come true.\nActing and response (not spoken): Offscreen Nanda answers her doubt with quiet certainty: soften the onset, give sach a clear warm emphasis, then let the breath settle. Keep his established position. The empty cloth/cradle insert carries the hope; add no new bodily action or visible speaker.\n\nLet his final word finish before the location cut.\n\n26–30s — Shot 7: A different world\nStraight cut to a newly staged 50mm medium exterior of Mathura prison at blue pre-dawn after rain, months after the Part 1 imprisonment. Frame the closed entrance leaves, a substantial section of stone arch and a burning wall torch. The entrance fills the composition; stone joints, damp metal and flame are clearly readable. A restrained short camera move reveals the depth of the doorway. Water drips from stone and the flame responds to a faint breeze. Birdsong gives way to drops and torch crackle. This is a different place and time, established by the architecture, light and sound.\n\nFINAL STATE:\nThe Gokul conversation is complete. Yashoda remained seated, Nanda remained standing, and both children left toward the right gateway. Final image: closed outer prison entrance at blue pre-dawn. Clip 4 can enter the cell for first-pregnant Devaki's sewing scene without changing its planned story or blocking."},{"id":"full-prompt/vachan-clip-04-a-mother-prepares-despite-fear","title":"Vachan Clip 04 — A mother prepares despite fear","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","clip-04","part-2","mythological","indian","hindi","multi-shot","timed-shots"],"negative":"","notes":"30 seconds | Part 2 01:30–02:00 · Current 21-clip edition","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"PART 2 — CLIP 04: A mother prepares despite fear\nDuration: 30 seconds | Part 2 01:30–02:00\n\nCreate a photorealistic live-action Indian mythological film sequence, landscape 16:9, real-time human motion except explicit editorial ellipses. Tactile cloth, worn stone/wood, natural skin, subtle film grain, rich restrained colors and readable shadows. Grandness comes from layered depth, human scal blic intimidation and tender celebration have different energies. Keep emotion alive after the last word and carry it into the next shot rather than resetting to a neutral portrait. Use the existing shot time for reaction and breath; these cues add no seconds or new cuts. Phonetic spelling helps pronunciation only; connected Hindi rhythm and emotional phrasing take priority over syllable-by-syllable reading.\n\nPRONUNCIATION USE:\nSpeak each DIALOGUE line once, using its Pronunciation guide only as a silent pronunciation aid. Never speak the words \"Pronunciation guide\" or repeat the guide as a second line. Hyphens separate syllables for guidance; deliver connected, natural Hindi rather than pausing at each hyphen. Capitals highlight articulation and long vowels, not shouting or artificial English stress. Preserve the specified emotion, speaker and existing time window. Keep bh, dh, th, chh and gh as Hindi aspirated consonants; th is not the English sound in \"think\". Preserve nasal vowels in main, mein, hain and hoon. Bhay means fear and is not bhaai (brother).\n\nATTACH IN THIS ORDER:\n[Image 1] = pregnant devki.png\nPregnant Devaki: same approved identity, plain off-white sari and blouse, head pallu and braid, clearly rounded pregnancy. No additional aging identity; use this pregnancy size consistently. Voice continuity: Use Devaki's young adult Hindi female voice, clear consonants and restrained breath breaks under grief.\n\n[Image 2] = vasudev.jpeg\nVasudev: approved face, dark beard, tied hair with slight silver at temples, beige-ivory dhoti/drape and thin necklace. Barefoot throughout prison/court journey. Keep slight greying fixed, not a new elderly face. Voice continuity: Low adult Hindi male voice, steady but weighted with grief; never confused with Kans's commanding delivery.\n\n[Image 3] = mathura prison cell.png\nDevaki/Vasudev cell: large dark stone chamber, small high barred window on LEFT wall, low stone sleeping bench on LEFT, rectangular iron double-leaf gate on RIGHT. Gate state determined by action, not open-state still.\n\n[Image 4] = mathura prison exterior.png\nPrison exterior: single monumental arched outer gate, blue night stone and local torchlight. Keep forecourt free of the incidental reference cart; no wedding chariot or horses at prison.\n\nOPENING AND PHYSICAL POSITIONS:\nInside that same prison at blue pre-dawn: first-pregnant Devaki sits LEFT bench sewing a keepsake; Vasudev stands one step at her RIGHT. Both wrist chains hang slack, feet free, gate closed.\n\nFIXED LOCATION GEOGRAPHY:\nApply each location only in its specified shots. Timed actions determine changing posture, custody, cuffs and gate state. A change of camera angle never moves an actor.\n[Image 3] GEOGRAPHY: Fixed stone bench and high small barred window on LEFT, rectangular double-leaf iron gate on RIGHT. From the doorway looking toward the bench, Devaki's assigned place is toward frame LEFT, Vasudev's beside her on frame RIGHT, nearer the gate. Their posture follows the shot action below. Keep that physical arrangement when framing reverses; do not swap their bodies. Low lamp stands against far wall clear of the route. Cool window light from LEFT, a small amber lamp pool, stone texture and readable faces. When worn, long slack wrist chains connect each prisoner's own cuffs, not the couple to each other; about 60 cm permits sewing, supported infant holding and comforting. Feet are free. No garment tie between them. Gate swings inward toward wall clearances, leaving middle passage clear. Exterior arched gateway is a different gate. Keep bench-to-door walking lane clear. Separate many small day tallies on the window wall from the later six large loss marks beside the bench.\n\nCAMERA AND ACTION CONTINUITY:\nBefore each cut, preserve the stated seats, standing places, facing directions, occupied hands and object ownership. A closer view crops the existing arrangement. For dialogue, place the listener on the speaker’s established eyeline; keep a recognizable listener shoulder or background landmark where framing permits. Movement finishes in the stated destination before the next action begins. Timed windows include physical movement and reactions.\n\nCELL DOOR HARDWARE LOCK: For this cell only, viewed from INSIDE facing the doorway, the active leaf is the RIGHT leaf hinged to the outer RIGHT jamb. The other leaf stays closed. The active leaf opens inward toward the adjacent right return wall; from the corridor the same physical leaf appears on the opposite side. Use the fixed hinge, threshold and wall as anchors. Closing retraces the same arc after people clear it. Ugrasena’s adjoining cell and the outer prison entrance have separate doors.\n\nLIVE BACKGROUND PERFORMANCE — INCLUDING DEFOCUSED PEOPLE:\nEvery visible background person is a live performer, not a still image or frozen plate. Start each shot with activity already in progress. Soft focus changes detail, never motion. Breathing and blinks continue, but are insufficient alone in blur: stagger small, readable silhouette changes such as a slight head turn, shoulder settling, a hand sliding from knee to chair arm, or a restrained lean and return. In a 6–10 second populated shot, let one or two visible extras complete different small actions at separate moments while the others breathe naturally. For shorter cuts carry an action across the cut instead of restarting everyone. Keep activity quieter than the speaker; no constant swaying, synchronized nodding, repeated loops, exaggerated gestures or newly invented speech. Maintain each person's seat, identity, clothing, eyeline and occupied hands across angles. An emotional silence means restrained living attention, never absolute bodily immobility. Do not add people to empty or private scenes. No frozen bokeh crowd, animated camera over a still background, moving cutout silhouettes or motion limited to flames and smoke.\n\nTIMED SHOTS:\n\n00–07s — Shot 1: Time made visible\n50mm slow lateral move from numerous small day-tally groups on high-window wall down to Devaki's cuffed hands sewing a little cream cloth. Window light LEFT, separate warm lamp. She uses a small needle carefully, chain hangs slack below lap, not through fabric. This cloth is a keepsake garment, not infant swaddle. Show modest pregnant silhouette.\n\n07–14s — Shot 2: He cannot ask\n50mm seated-height two-shot from gate side. Devaki on bench LEFT, Vasudev standing one step to her RIGHT within reach. 07–14s Vasudev, watching the cloth before her face, voice catching: \"Devaki, tum vastra kyon see rahi ho? Tum jaanti ho...\"\nPronunciation guide: DE-va-kee, tum VAS-tra kyoon see ra-HEE ho? tum JAAN-tee ho...\nEnglish meaning (not spoken): Why sew baby clothes when you know what awaits our child?\nActing and response (not spoken): Vasudev wants to protect her from hope he cannot bear. Look at the cloth first; jaw tightens before Devaki, voice catches at tum jaanti ho and the unfinished thought dies on an exhale. Shoulders sink rather than expanding into a speech. Devaki pauses the needle and slowly meets his eyes.\n\nShe pauses the needle; last beat her eyes lift.\n\n14–25s — Shot 3: Maternal resolve\nSCENE STATE AT THIS CUT: Devaki seated on LEFT bench, needle paused over keepsake cloth; Vasudev standing at her RIGHT. Both linked wrist cuffs slack; same first pregnancy and pre-dawn.\n75mm Devaki portrait, breath-level handheld. 15–25s Devaki: \"Jaanti hoon. Par main maata bhi hoon. Maata apne baalak ke liye vastra seeti hai... chahe woh vastra...\"\nPronunciation guide: JAAN-tee hoon. par main MAA-taa bhee hoon. MAA-taa AP-ne BAA-lak ke li-ye VAS-tra SEE-tee hai... CHAA-he wo VAS-tra...\nEnglish meaning (not spoken): I know, but I am still a mother and must prepare for my child.\nActing and response (not spoken): Devaki answers with maternal resolve despite fear. Lift her gaze firmly on maata bhi hoon; the voice briefly steadies, then weakens as she looks at the unfinished hem on chahe woh vastra. Lower lip trembles at the unfinished ending. Keep needle still and cuffs slack; Vasudev absorbs the pain without nodding through the line.\n\nShe looks at the unfinished hem; throat tightens at final words. Her face holds effort, not a fixed grief mask.\n\n25–30s — Shot 4: Acceptance\n65mm Vasudev, tears gathering as he listens fully before speaking. 26–29s Vasudev: \"Main tumhe rok nahi sakta.\"\nPronunciation guide: main tum-HE rok na-HEE SAK-taa.\nEnglish meaning (not spoken): I cannot stop you.\nActing and response (not spoken): Vasudev yields with grief, not permission from authority. Eyes lower, a difficult swallow precedes the soft line, breath releases on sakta. Preserve his scripted movement to sit beside her. Devaki’s shoulders loosen slightly while her attention stays on the cloth.\n\nHe lowers himself beside her on her RIGHT, carefully keeping her sewing space free.\n\nFINAL STATE:\nFirst-pregnant Devaki sits on LEFT bench with needle paused over cream keepsake cloth. Vasudev has just sat beside her on her RIGHT. Both have slack wrist cuffs, feet free; gate closed, pre-dawn light. Needle has not yet been put away."},{"id":"full-prompt/vachan-clip-05-a-first-birth-behind-bars","title":"Vachan Clip 05 — A first birth behind bars","category":"full-prompt","medium":["video"],"models":["seedance-2"],"tags":["krishna-vachan","clip-05","part-2","mythological","indian","hindi","multi-shot","timed-shots"],"negative":"","notes":"30 seconds | Part 2 02:00–02:30 · Current 21-clip edition","source":"ALL_21_VIDEO_PROMPTS_8.md","body":"PART 2 — CLIP 05: A first birth behind bars\nDuration: 30 seconds | Part 2 02:00–02:30\n\nCreate a photorealistic live-action Indian mythological film sequence, landscape 16:9, real-time human motion except explicit editorial ellipses. Tactile cloth, worn stone/wood, natural skin, subtle film grain, rich restrained colors and readable shadows. Grandness comes from layered depth, human scale, motivated reveals and emotiona isitor on the centre runner facing the NORTH throne appears screen-LEFT looking RIGHT; Kans appears screen-RIGHT looking LEFT toward that visitor. Close coverage preserves these eyelines and positions. Side tracking keeps the destination ahead of the walking subject. Named listeners on the EAST side, such as Pralamb, retain their separate established marks; each speaker turns eyes toward the actual addressed person.\n\nCELL DOOR HARDWARE LOCK: For this cell only, viewed from INSIDE facing the doorway, the active leaf is the RIGHT leaf hinged to the outer RIGHT jamb. The other leaf stays closed. The active leaf opens inward toward the adjacent right return wall; from the corridor the same physical leaf appears on the opposite side. Use the fixed hinge, threshold and wall as anchors. Closing retraces the same arc after people clear it. Ugrasena’s adjoining cell and the outer prison entrance have separate doors.\n\nLIVE BACKGROUND PERFORMANCE — INCLUDING DEFOCUSED PEOPLE:\nEvery visible background person is a live performer, not a still image or frozen plate. Start each shot with activity already in progress. Soft focus changes detail, never motion. Breathing and blinks continue, but are insufficient alone in blur: stagger small, readable silhouette changes such as a slight head turn, shoulder settling, a hand sliding from knee to chair arm, or a restrained lean and return. In a 6–10 second populated shot, let one or two visible extras complete different small actions at separate moments while the others breathe naturally. For shorter cuts carry an action across the cut instead of restarting everyone. Keep activity quieter than the speaker; no constant swaying, synchronized nodding, repeated loops, exaggerated gestures or newly invented speech. Maintain each person's seat, identity, clothing, eyeline and occupied hands across angles. An emotional silence means restrained living attention, never absolute bodily immobility. Do not add people to empty or private scenes. No frozen bokeh crowd, animated camera over a still background, moving cutout silhouettes or motion limited to flames and smoke.\n\nTIMED SHOTS:\n\n00–05s — Shot 1: Gate opens correctly\nFIXED CAMERA INSIDE THE CELL, beside the bench and looking diagonally toward the doorway. Keep the cell floor in the foreground and the corridor beyond the bars in the background. Guard A begins entirely in that corridor, facing into the cell. Show the same doorway throughout this take. The right-hand leaf in THIS inside view pivots on the outer RIGHT stone jamb; the left-hand leaf remains closed. At the opening instant the latch is already released, with the removed padlock visibly in the guard’s left hand; a final key click bridges from Clip 6. His right palm pushes the active leaf toward the camera and inward along its fixed hinge arc, until the leaf rests beside the RIGHT return wall. The clear opening is between the stationary left leaf and the opened right leaf. Guard walks from background corridor through that opening onto the foreground cell floor. One opening, one entrance, one steady camera; hold the visible hinge and floor threshold as spatial anchors. The parents stay seated at the bench. This shot depicts opening and entrance only; unlocking is conveyed by the initial released latch and retained padlock.\n\n05–10s — Shot 2: Vasudev rises; hands freed\n50mm steady bench-side medium, Devaki seated screen-LEFT with the baby and Vasudev screen-CENTRE beside her; Guard A stops screen-RIGHT within arm’s reach. Vasudev rises in place and offers both cuffed wrists, eyes lowered in reluctant acceptance. Cut on his offered hands to a contact insert: first cuff has just been opened, and the guard opens the second, then takes the entire linked pair away. End on Vasudev’s two bare wrists, palms empty, guard retaining both cuffs together. The cut compresses the first unlocking operation; removed cuffs remain with the guard for all later shots. Devaki keeps supporting the infant throughout.\n\n10–16s — Shot 3: One supported transfer\nSteady medium showing both adults’ complete supporting arms and the entire infant throughout. Vasudev bends beside seated Devaki, facing the SAME direction as her rather than facing her across the baby. The infant lies horizontally, head already at Devaki’s anatomical LEFT and feet toward her RIGHT. Vasudev slides his LEFT forearm beneath that SAME head end and his RIGHT hand beneath the hips. Devaki keeps her support until his cradle is secure, then withdraws. The baby translates gently from her lap into his arms while maintaining the same head-to-feet orientation throughout; his head settles in Vasudev’s LEFT elbow. Keep the head, both sets of hands and swaddle readable throughout the lift. End with her empty hands withdrawing and his complete stable hold. Her eyes follow the child with grief; his jaw tightens. The camera stays still and the actors’ shoulders leave the contact unobscured.\n\n16–19s — Shot 4: Leave through the cleared doorway\nGate-side medium coverage. Guard A leads through the already open RIGHT doorway; Vasudev follows carrying Kirtiman with head supported in LEFT elbow. They use the clear central walking lane and pass beside the stationary open leaf. Devaki stays seated LEFT, watching them leave. End after both men clear the threshold. Cut away with the gate still open; closure occurs during the following time ellipsis.\n\n19–26s — Shot 5: Enter, walk and settle\nExplicit time-and-location cut to the court later that morning; the prison journey has elapsed. ONE UNBROKEN 35mm east-side wide tracking shot. Begin with Vasudev already crossing into the occupied audience hall from the southern entrance, approximately four metres from his final stopping mark. Keep the red runner leading ahead toward Kans, already seated screen-RIGHT on the elevated gold throne above the red-covered steps. Vasudev travels screen-LEFT to RIGHT. The entrance stays behind him. Establish the full body, bare feet, secure infant cradle, occupied side rows and destination together; no frontal walk toward the camera with the throne behind him.\n19–24.5s: follow six to eight measured, natural footfalls along the runner. Match walking speed with a gentle lateral/dolly track from the EAST side; do not orbit, cross the axis, cut ahead or accelerate the walk. Let near pillars and seated rows pass at different depths so the approach has real distance. Guard A follows two paces behind at the same pace, cuffs secured on his belt; he never overtakes. Vasudev's weight transfers naturally, cloth moves with his steps, and his supporting arms remain stable around Kirtiman. Baby's head stays in his anatomical LEFT elbow, hips supported by RIGHT hand. No sliding feet, bouncing infant or change of carrying side. Background courtiers turn their heads at different moments as he passes; a different seated person settles a shoulder or hand. No crowd freeze, synchronized gestures or standing ovation.\n24.5–26s: Vasudev decelerates, completes his final step and plants both feet on the LOWER FLOOR approximately one metre BEFORE the lowest red-covered riser. Guard A stops two paces behind. Pralamb remains separately visible at the EAST foot of the steps, outside their lane. Camera gently settles with Vasudev. He takes a quiet breath and lifts his eyes toward Kans; no bow, stair climb or infant offering. Kans remains seated and silent. Hold the floor gap and elevated throne clearly before the dialogue cut. No spoken dialogue during this approach.\n\n26–34s — Shot 6: The vow delivered\n65mm medium close-up from the SAME EAST side, cutting only after Vasudev has stopped. Vasudev remains screen-LEFT on the lower floor, three-quarter profile facing RIGHT with eyes slightly UP toward elevated Kans. Use a soft, recognizable edge of the elevated throne/king at far screen-RIGHT; do not force both faces into an equal-height intimate two-shot. Keep enough of Vasudev's torso and both supporting arms to read the baby's safe
